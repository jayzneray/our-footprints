<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我们的足迹</title>
<meta name="description" content="我们一起走过的地方">
<link rel="icon" href="public/favicon.svg">
<style>
@font-face { font-family:'TravelSerif'; src:url('public/fonts/noto-serif-sc-500-subset.woff') format('woff'); font-weight:500; font-display:swap; }
:root{
  --bg:#12100E; --ink:#EDE6DA; --muted:#8C8378; --faint:#2A2622; --line:rgba(237,230,218,.10); --accent:#C9A27A;
  --serif:'TravelSerif','Noto Serif SC','Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif;
  --sans:-apple-system,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif;
  --pad:72px; --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.82) contrast(.93) brightness(.9) sepia(.1)}
:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* top bar */
.top{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:30px var(--pad);font-size:12px;letter-spacing:.24em;color:rgba(237,230,218,.62);transition:background .4s var(--ease),padding .4s var(--ease)}
.top .mark{font-family:var(--serif);font-weight:500;letter-spacing:.3em;opacity:0;transition:opacity .4s var(--ease);cursor:pointer}
body.scrolled .top{background:rgba(18,16,14,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:22px;padding-bottom:22px}
body.scrolled .top .mark{opacity:1}
.switch{display:flex;gap:22px;font-family:var(--serif);font-weight:500;align-items:center}
.switch span{padding-bottom:5px;cursor:pointer;transition:color .3s var(--ease)}
.switch span:hover{color:var(--ink)}
.switch .on{color:var(--ink);border-bottom:1px solid var(--accent)}

/* music toggle */
.detail-bar .music-toggle{margin-left:auto}
.detail-bar .dnav + .music-toggle{margin-left:16px}
body.view-china .top{background:rgba(18,16,14,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:22px;padding-bottom:22px}
body.view-china .top .mark{opacity:1}
.music-toggle{margin-left:16px;padding:8px;display:none;align-items:center;justify-content:center;gap:3px;height:32px;width:32px;background:transparent;border:0;cursor:pointer;position:relative;border-radius:2px}
.music-toggle:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
.music-toggle.visible{display:flex}
.music-toggle .bar{width:2px;height:14px;background:#EDE6DA;opacity:.7;border-radius:1px;transform-origin:center;transform:scaleY(.22);transition:transform .2s var(--ease),opacity .2s var(--ease);display:block}
.music-toggle:hover .bar{opacity:1}
.music-toggle .mt-lbl{position:absolute;right:100%;top:50%;transform:translateY(-50%);margin-right:6px;font-size:11px;letter-spacing:.2em;color:rgba(237,230,218,.7);opacity:0;transition:opacity .2s var(--ease);pointer-events:none;white-space:nowrap;font-family:var(--sans,"Noto Sans SC",sans-serif)}
.music-toggle:hover .mt-lbl{opacity:1}
.music-toggle.playing .bar{animation:musicBars 1.1s ease-in-out infinite}
.music-toggle.playing .bar:nth-child(1){animation-delay:0s}
.music-toggle.playing .bar:nth-child(2){animation-delay:.18s}
.music-toggle.playing .bar:nth-child(3){animation-delay:.36s}
.music-toggle.playing .bar:nth-child(4){animation-delay:.54s}
@keyframes musicBars{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}

/* hero */
.hero{position:relative;height:100vh;min-height:620px;overflow:hidden}
.hero .hero-img-wrap{position:absolute;inset:0;overflow:hidden}
.hero img{object-position:50% 74%;transform:scale(1.06);transition:transform 1.6s var(--ease);will-change:transform}
.hero.loaded img{transform:scale(1.02)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(18,16,14,.75) 0%,rgba(18,16,14,0) 45%),linear-gradient(to bottom,rgba(18,16,14,.45) 0%,rgba(18,16,14,0) 20%);pointer-events:none}
.hero-text{position:absolute;left:var(--pad);bottom:84px;z-index:2;opacity:0;transform:translateY(14px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.hero.loaded .hero-text{opacity:1;transform:none}
.hero h1{margin:0;font-family:var(--serif);font-weight:500;font-size:62px;letter-spacing:.16em;line-height:1;color:#F1EBE0}
.hero p{margin:26px 0 0;font-size:14px;letter-spacing:.22em;color:#EDE6DA;opacity:.85;text-shadow:0 1px 12px rgba(18,16,14,.6)}
.hero .cap{position:absolute;right:var(--pad);bottom:88px;z-index:2;font-size:11px;letter-spacing:.24em;color:rgba(237,230,218,.78);text-align:right;line-height:2;text-shadow:0 1px 12px rgba(18,16,14,.6)}
.hero .cue{position:absolute;left:50%;bottom:0;width:1px;height:56px;background:rgba(237,230,218,.32);z-index:2;cursor:pointer}

/* index intro */
.intro{display:grid;grid-template-columns:repeat(12,1fr);gap:0 24px;padding:150px var(--pad) 40px;align-items:end}
.intro .lab{grid-column:1/4;font-size:11px;letter-spacing:.3em;color:var(--muted)}
.intro .lede{grid-column:5/11;font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.9;letter-spacing:.08em;color:rgba(237,230,218,.86);margin:0}
.intro .lede em{font-style:normal;color:var(--accent)}

/* year */
.year{display:grid;grid-template-columns:repeat(12,1fr);gap:0 24px;padding:120px var(--pad) 56px;align-items:end;border-bottom:1px solid var(--line);margin:0 var(--pad);padding-left:0;padding-right:0}
.year .num{grid-column:1/8;font-family:var(--serif);font-weight:500;font-size:150px;line-height:.8;letter-spacing:.02em;color:var(--faint)}
.year .meta{grid-column:10/13;text-align:right;font-size:11px;letter-spacing:.28em;color:var(--muted);padding-bottom:6px}

/* trips */
.trip{display:grid;grid-template-columns:repeat(12,1fr);gap:0 24px;padding:96px var(--pad) 0;align-items:end}
.trip figure{margin:0;overflow:hidden;background:#1A1714;cursor:pointer}
.trip figure .img-wrap{position:relative;width:100%;height:100%;overflow:hidden}
.trip figure img{transition:transform .9s var(--ease)}
.trip figure:hover img{transform:scale(1.03)}
.t-no{font-size:11px;letter-spacing:.3em;color:var(--muted);margin-bottom:22px}
.t-title{margin:0;font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.35;letter-spacing:.06em;cursor:pointer;transition:color .4s var(--ease)}
.t-title:hover{color:#F1EBE0}
.t-meta{margin-top:18px;font-size:12px;letter-spacing:.18em;color:var(--muted);line-height:2}
.t-meta b{font-weight:400;color:rgba(237,230,218,.78)}
.t-more{display:inline-block;margin-top:30px;font-size:11px;letter-spacing:.3em;color:rgba(237,230,218,.62);border-bottom:1px solid rgba(201,162,122,.6);padding-bottom:6px;cursor:pointer;transition:color .3s var(--ease),border-color .3s var(--ease)}
.t-more:hover{color:var(--ink);border-color:var(--accent)}

.L figure{grid-column:1/8;aspect-ratio:4/5}
.L .txt{grid-column:9/13;padding-bottom:12px}
.Lr figure{grid-column:6/13;aspect-ratio:4/5;grid-row:1}
.Lr .txt{grid-column:1/5;grid-row:1;padding-bottom:12px}
.M figure{grid-column:7/12;aspect-ratio:3/4;grid-row:1}
.M .txt{grid-column:2/6;grid-row:1;align-self:start;padding-top:120px}
.Ml figure{grid-column:2/7;aspect-ratio:3/4}
.Ml .txt{grid-column:8/12;align-self:start;padding-top:120px}
.S figure{grid-column:8/11;aspect-ratio:3/4;grid-row:1}
.S .txt{grid-column:3/7;grid-row:1;padding-bottom:12px}
.T{padding-top:72px;cursor:pointer}
.T .txt{grid-column:5/12;display:grid;grid-template-columns:90px 1fr auto;align-items:baseline;border-top:1px solid var(--line);padding-top:26px}
.T .t-no{margin:0}
.T .t-title{font-size:24px}
.T .t-meta{margin:0;text-align:right}
.T .t-title:hover{color:#F1EBE0}

/* divider */
.turn{padding:150px var(--pad) 130px;text-align:center}
.turn .rule{width:1px;height:56px;background:rgba(201,162,122,.55);margin:0 auto 48px}
.turn h2{margin:0;font-family:var(--serif);font-weight:500;font-size:34px;letter-spacing:.42em;padding-left:.42em;color:var(--ink)}
.turn p{margin:30px 0 0;font-size:11px;letter-spacing:.34em;color:var(--muted)}

/* full-bleed */
.bleed{position:relative;margin-top:0;height:84vh;min-height:560px;overflow:hidden;cursor:pointer}
.bleed img{object-position:50% 56%}
.hero .img-wrap,.bleed .img-wrap{position:absolute;inset:0;height:100%}
.hero .hero-img-wrap,.bleed .img-wrap{z-index:0}
.hero::after,.bleed::after{z-index:1}
.hero p{font-weight:500}
.bleed .txt{z-index:3}
.bleed::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,16,14,0) 55%,rgba(18,16,14,.72) 100%)}
.bleed .txt{position:absolute;left:var(--pad);bottom:64px;z-index:2}
.bleed .t-title{font-size:44px}
.bleed .t-title:hover{color:#F1EBE0}

/* places archive */
.archive{padding:200px var(--pad) 120px}
.archive .lab{font-size:11px;letter-spacing:.3em;color:var(--muted);margin-bottom:40px}
.arch{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.arch .arch-item{cursor:pointer}
.arch figure{margin:0 0 22px;aspect-ratio:4/5;overflow:hidden}
.arch figure .img-wrap{position:relative;width:100%;height:100%;overflow:hidden}
.arch figure img{transition:transform .9s var(--ease)}
.arch .arch-item:hover figure img{transform:scale(1.03)}
.arch .t-title{font-size:24px;cursor:pointer}
.arch .arch-item:hover .t-title{color:#F1EBE0}
.end{padding:120px var(--pad) 140px;text-align:center;font-family:var(--serif);font-weight:500;font-size:16px;letter-spacing:.4em;color:var(--muted)}

/* lqip wrapper */
.img-wrap{position:relative;overflow:hidden;background-color:#1A1714;background-size:cover;background-position:center}
.img-wrap img{position:relative;z-index:1;opacity:0;transition:opacity .5s var(--ease)}
.img-wrap img.loaded{opacity:1}

/* mini globe */
.mini{position:fixed;right:32px;bottom:28px;z-index:30;display:none;flex-direction:column;align-items:center;gap:8px;opacity:0;transform:translateY(8px);transition:opacity .6s var(--ease),transform .6s var(--ease);pointer-events:none}
body.scrolled .mini{opacity:1;transform:none;pointer-events:auto;display:flex}
body.detail .mini{display:none!important}
.mini .lbl{text-align:center;text-shadow:0 1px 10px rgba(18,16,14,.9);transition:opacity .2s;order:2;padding:0;background:none;border-radius:0}
.mini .c{font-family:var(--serif);font-weight:500;font-size:15px;letter-spacing:.2em;color:var(--ink)}
.mini .n{margin-top:6px;font-size:10px;letter-spacing:.28em;color:var(--muted)}
.mini .canvas-wrap{order:1;transition:width .5s var(--ease),height .5s var(--ease);width:120px;height:120px;position:relative}
.mini.grow .canvas-wrap{width:var(--gs,220px);height:var(--gs,220px)}
.mini canvas{width:100%;height:100%;cursor:pointer;display:block}

/* reveal */
.js-reveal .reveal{opacity:0;transform:translateY(24px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.js-reveal .reveal.on{opacity:1;transform:none}

/* page transitions */
#app{transition:opacity .28s var(--ease)}
#app.leaving{opacity:0}
#app.entering{opacity:0}
#app.entered{opacity:1;transition-duration:.32s}

/* detail */
.detail-bar{position:fixed;top:0;left:0;right:0;z-index:40;height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 var(--pad);background:rgba(10,9,8,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12px;letter-spacing:.16em;color:rgba(242,237,228,.55)}
.detail-bar a{transition:color .3s var(--ease);white-space:nowrap}
.detail-bar a:hover{color:var(--ink)}
.detail-bar .dnav{display:flex;gap:28px;align-items:center;margin-left:auto}
.detail-bar .dnav a{max-width:44vw;overflow:hidden;text-overflow:ellipsis}
.detail-cover{position:relative;height:78vh;min-height:480px;overflow:hidden}
.detail-cover .img-wrap{position:absolute;inset:0}
.detail-cover img{object-fit:cover}
.detail-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,16,14,.15) 0%,rgba(18,16,14,0) 40%,rgba(18,16,14,.82) 100%);z-index:1}
.detail-cover .dtxt{position:absolute;left:var(--pad);bottom:60px;z-index:2}
.detail-head{padding:160px var(--pad) 40px}
.detail-head .kicker{font-size:11px;letter-spacing:.3em;color:var(--muted);margin-bottom:26px}
.detail-head h1{margin:0;font-family:var(--serif);font-weight:500;font-size:48px;line-height:1.3;letter-spacing:.06em;color:#F1EBE0}
.detail-cover h1{margin:0;font-family:var(--serif);font-weight:500;font-size:48px;line-height:1.3;letter-spacing:.06em;color:#F1EBE0}
.detail-cover .kicker{font-size:11px;letter-spacing:.3em;color:rgba(242,237,228,.6);margin-bottom:26px}
.detail-meta{margin-top:20px;font-size:12px;letter-spacing:.18em;color:var(--muted);line-height:2}

/* stats row */
.stats-row{display:flex;gap:72px;padding:48px var(--pad);border-top:1px solid var(--line);margin:0 var(--pad);padding-left:0;padding-right:0;flex-wrap:wrap}
.stats-row .stat{}
.stats-row .stat .num{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.1;letter-spacing:.02em;color:var(--ink)}
.stats-row .stat .lab{margin-top:8px;font-size:11px;letter-spacing:.24em;color:var(--muted)}

.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:48px var(--pad);border-top:1px solid var(--line);margin:0 var(--pad);padding-left:0;padding-right:0}
.facts .f-lab{font-size:10px;letter-spacing:.3em;color:var(--muted);margin-bottom:12px}
.facts .f-val{font-size:14px;letter-spacing:.08em;color:rgba(237,230,218,.86);line-height:1.8}
.visits-list{padding:0 var(--pad) 20px}
.visits-list .v-row{display:grid;grid-template-columns:220px 1fr;gap:24px;padding:22px 0;border-top:1px solid var(--line)}
.visits-list .v-date{font-size:12px;letter-spacing:.16em;color:var(--muted)}
.visits-list .v-note{font-size:14px;letter-spacing:.06em;color:rgba(237,230,218,.86)}
.visits-list .v-text{margin:10px 0 0;font-size:14px;line-height:2;letter-spacing:.03em;color:rgba(237,230,218,.62);max-width:40em}
.stops-line{padding:0 var(--pad) 40px;font-size:14px;letter-spacing:.08em;color:rgba(237,230,218,.86)}
.stops-line .s-lab{font-size:10px;letter-spacing:.3em;color:var(--muted);display:block;margin-bottom:14px}
.photos-sec{padding:120px var(--pad)}
.photos-sec .place-lab{font-size:11px;letter-spacing:.3em;color:var(--muted);margin:0 0 26px}
.photos-sec .place-block{margin-bottom:40px}
.photos-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
.photos-grid .p-item{margin:0;overflow:hidden;cursor:pointer;background:#1A1714;opacity:0;transition:opacity .7s var(--ease)}
.photos-grid .p-item.loaded{opacity:1}
.photos-grid .p-item:nth-child(3n+1){grid-column:1/8}
.photos-grid .p-item:nth-child(3n+2){grid-column:9/13}
.photos-grid .p-item:nth-child(3n){grid-column:3/11}
.photos-grid .p-item img{transition:transform .9s var(--ease)}
.photos-grid .p-item:hover img{transform:scale(1.03)}
.place-info{padding:20px var(--pad) 0}
.place-info .pi-title{font-family:var(--serif);font-weight:500;font-size:20px;letter-spacing:.08em;margin:0 0 14px;color:rgba(237,230,218,.9)}
.place-info .pi-date{font-size:11px;letter-spacing:.2em;color:var(--muted);margin-bottom:10px}
.place-info .pi-memory{font-size:14px;line-height:2;letter-spacing:.04em;color:rgba(237,230,218,.72);max-width:640px}
.detail-foot{padding:120px var(--pad) 140px;border-top:1px solid var(--line);margin:0 var(--pad);padding-left:0;padding-right:0}
.detail-foot .dnav2{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:120px}
.detail-foot .dnav2 a{display:block}
.detail-foot .dnav2 .d-lab{font-size:10px;letter-spacing:.3em;color:var(--muted);margin-bottom:16px}
.detail-foot .dnav2 .d-title{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.4;letter-spacing:.06em;color:rgba(237,230,218,.86);transition:color .3s var(--ease)}
.detail-foot .dnav2 a:hover .d-title{color:var(--ink)}
.detail-foot .dnav2 .d-right{text-align:right}
.detail-end{text-align:center;font-family:var(--serif);font-weight:500;font-size:16px;letter-spacing:.4em;color:var(--muted)}

/* itinerary */
.itin-sec{padding:60px var(--pad) 100px;border-top:1px solid var(--line);margin:0 var(--pad);padding-left:0;padding-right:0}
.itin-sec .itin-lab{font-size:11px;letter-spacing:.3em;color:var(--muted);margin-bottom:40px}
.itin-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:0 24px}
.itin-days{grid-column:1/7}
.itin-map{grid-column:8/13;position:sticky;top:88px;height:calc(100vh - 120px);align-self:start}
.itin-map svg{width:100%;height:100%;display:block;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 80%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 80%,transparent 100%)}
.itin-day{min-height:60vh;padding-bottom:40px}
.itin-day.nophoto{min-height:0;padding-bottom:28px}
.itin-day .day-kick{font-size:11px;letter-spacing:.26em;color:var(--muted);margin-bottom:14px}
.itin-day .day-city{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:.06em;color:var(--ink);margin:0 0 12px}
.itin-day .day-transport{font-size:12px;letter-spacing:.14em;color:var(--muted);margin-bottom:14px}
.itin-day .day-title{font-family:var(--serif);font-weight:500;font-size:17px;letter-spacing:.08em;color:rgba(241,235,224,.92);margin-bottom:12px}
.itin-day .day-note{font-size:14px;line-height:2;letter-spacing:.03em;color:rgba(237,230,218,.66);margin-bottom:10px;max-width:34em}
.itin-day .day-meta{font-size:11px;letter-spacing:.18em;color:var(--muted);margin-bottom:26px}
.itin-day .day-photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.itin-day .day-photos .dp{position:relative;aspect-ratio:1/1;cursor:pointer}
.itin-day .day-photos .dp.wide{grid-column:1/3;aspect-ratio:16/10}
.itin-day .day-photos .img-wrap{width:100%;height:100%}
.itin-day .day-photos img{transition:transform .7s var(--ease)}
.itin-day .day-photos .dp:hover img{transform:scale(1.03)}

.itin-day.cur .day-city{color:var(--accent)}

/* detail map */
.dmap{width:100%;height:100%}
.dmap .country{fill:rgba(237,230,218,.045);stroke:rgba(237,230,218,.15);stroke-width:.5;vector-effect:non-scaling-stroke}
.dmap .country.trip{fill:#2A241E;stroke:rgba(237,230,218,.22);stroke-width:.6}
.dmap .leg{fill:none;stroke:rgba(201,162,122,.28);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.dmap .leg.done{stroke:var(--accent)}
.dmap .city-dot{fill:var(--accent)}
.dmap .city-ring{fill:none;stroke:var(--accent);stroke-width:1;opacity:0}
.dmap .city-lbl{font-family:var(--serif);font-size:13px;fill:rgba(237,230,218,.85);letter-spacing:.06em;paint-order:stroke;stroke:rgba(18,16,14,.85);stroke-width:3px;stroke-linejoin:round}
.dmap .city-dot.cur{fill:var(--accent)}
.dmap .city-lbl.cur{fill:var(--accent)}
.dmap .city-leader{stroke:rgba(237,230,218,.35);stroke-width:1;fill:none;vector-effect:non-scaling-stroke}
/* china view */
.china-head{padding:150px var(--pad) 40px}
.china-head .lab{font-size:11px;letter-spacing:.3em;color:var(--muted);margin-bottom:24px}
.china-head h2{margin:0;font-family:var(--serif);font-weight:500;font-size:44px;letter-spacing:.06em;line-height:1.35;color:#F1EBE0}
.china-map-wrap{padding:40px var(--pad) 60px;display:flex;justify-content:center}
.china-map{width:100%;max-width:760px}
.china-map svg{width:100%;height:auto;display:block}

<script src="public/lib/d3.min.js"></script>
<script>
(function(){
'use strict';

// ---------- constants ----------
var LEAD = {
  '2019-korea':['korea/03','M'], '2024-iceland':['iceland/04','L'], '2024-switzerland':['switzerland/05','M'],
  '2024-thailand':['thailand/05','S'], '2024-morocco':['morocco/07','B'], '2025-wales':['wales/06','L'],
  '2025-france':['france/06','M'], '2025-italy-spring':['vatican/01','Lr'], '2025-greece':['greece/04','Ml'],
  '2025-spain-summer':['spain/04','L'], '2025-car-day':['birmingham/02','Ml'], '2026-sea-honeymoon':['malaysia/03','M']
};
var ARCH_IMG = {'uk-years':'london/06','edinburgh-again':'edinburgh/01','china':'qinhuangdao/04'};
var VATICAN_MAP = '意大利';
var WORLD_FALLBACK = {lat:31.8, lng:-7.1};

// ---------- utils ----------
function pad(n){ return String(n).padStart(2,'0'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function photoURL(src){ if(!src) return ''; return 'public/' + src; }
function thumbURL(src){ if(!src) return ''; if(/\.webp$/.test(src)) return 'public/' + src.replace(/\.webp$/,'-thumb.webp'); return photoURL(src); }
function globeCountry(name){ if(!name) return ''; return name === '梵蒂冈' ? VATICAN_MAP : name; }
function normDate(s){
  if(!s) return null;
  var parts = s.split('-').map(function(x){return parseInt(x,10);});
  return {y:parts[0], m:parts[1]||1, d:parts[2]||1, raw:s, hasMonth:parts.length>1, hasDay:parts.length>2};
}
function fmtRange(start, end){
  var a = normDate(start), b = normDate(end);
  if(!a) return '';
  function seg(n){
    if(n.hasDay) return n.y + '.' + pad(n.m) + '.' + pad(n.d);
    if(n.hasMonth) return n.y + '.' + pad(n.m);
    return String(n.y);
  }
  if(!b) return seg(a);
  var out = seg(a) + ' — ';
  if(b.y !== a.y) out += seg(b);
  else if(b.hasDay) out += pad(b.m) + '.' + pad(b.d);
  else if(b.hasMonth) out += pad(b.m);
  else out += String(b.y);
  return out;
}
function nightsText(n){ return (n==null) ? '' : (n + ' 晚'); }
function metaLine(t){
  var parts = [];
  if(t.countries && t.countries.length) parts.push(t.countries.join(' · '));
  var r = fmtRange(t.start, t.end);
  if(r) parts.push(r);
  var nt = nightsText(t.nights);
  if(nt) parts.push(nt);
  return parts;
}
function tripPhotos(trip, placesMap){
  if(!trip || !trip.places) return [];
  var out = [];
  trip.places.forEach(function(pid){
    var p = placesMap[pid];
    if(p && p.photos) out = out.concat(p.photos);
  });
  return out;
}

// calendar day diff, inclusive
function inclusiveDays(start, end){
  var a = normDate(start), b = normDate(end);
  if(!a || !b) return null;
  if(!a.hasDay || !b.hasDay) return null;
  var da = Date.UTC(a.y, a.m-1, a.d);
  var db = Date.UTC(b.y, b.m-1, b.d);
  var diff = Math.round((db - da)/86400000);
  if(isNaN(diff) || diff < 0) return null;
  return diff + 1;
}
function nightsBetween(start, end){
  var a = normDate(start), b = normDate(end);
  if(!a || !b) return null;
  if(!a.hasDay || !b.hasDay) return null;
  var da = Date.UTC(a.y, a.m-1, a.d);
  var db = Date.UTC(b.y, b.m-1, b.d);
  var diff = Math.round((db - da)/86400000);
  if(isNaN(diff) || diff < 0) return null;
  return diff;
}

// ---------- state ----------
var STATE = {
  trips: [], places: {}, placesList: [], placesMap: {},
  worldGeo: null, chinaGeo: null,
  tripSeq: [],
  homeScroll: 0, chinaScroll: 0,
  currentView: 'world',
  returnView: 'world',
  coverPhotosMap: {},
  story: {}, // tripId -> {route, days}
  storyLoaded: false
};

// ---------- data load ----------
function loadJSON(url){
  return fetch(url).then(function(r){ if(!r.ok) throw new Error(url); return r.json(); });
}
function loadOptionalJSON(url){
  return fetch(url).then(function(r){ if(!r.ok) throw new Error(url); return r.json(); });
}

var storyPath = 'data/trips-story.json';
try {
  var sp = new URLSearchParams(location.search).get('story');
  if(sp) storyPath = sp;
} catch(e){}

Promise.all([
  loadJSON('public/data/trips.json'),
  loadJSON('public/data/places.json'),
  loadJSON('public/data/world-countries.json'),
  loadJSON('public/data/china-provinces.json'),
  loadOptionalJSON(storyPath).catch(function(){ return null; })
]).then(function(res){
  STATE.trips = res[0].trips || [];
  STATE.placesList = (res[1].places || []);
  STATE.placesMap = {};
  STATE.placesList.forEach(function(p){ STATE.placesMap[p.id] = p; });
  STATE.worldGeo = res[2];
  STATE.chinaGeo = res[3];
  STATE.tripSeq = STATE.trips.filter(function(t){return t.kind==='trip';}).slice().sort(function(a,b){
    return (a.start||'').localeCompare(b.start||'');
  });
  if(res[4]){
    try { STATE.story = normalizeStory(res[4]); STATE.storyLoaded = true; } catch(e){ STATE.story = {}; }
  }
  // assign photos per trip story
  Object.keys(STATE.story).forEach(function(tid){
    var trip = STATE.trips.find(function(t){return t.id===tid;});
    if(!trip) return;
    var tp = tripPhotos(trip, STATE.placesMap);
    assignDayPhotos({trip:trip, tripPhotos:tp}, STATE.story[tid].days);
  });
  initGlobe();
  initReveal();
  animateRoute(function(){ router(); });
}).catch(function(err){
  console.error(err);
  document.getElementById('app').innerHTML = '<div class="load-error">加载失败，请刷新</div>';
});

// ---------- story normalizer ----------
function normalizeStory(raw){
  var out = {};
  if(!raw) return out;
  var tripsObj = null;
  if(Array.isArray(raw)) tripsObj = raw;
  else if(raw.trips){
    if(Array.isArray(raw.trips)) tripsObj = raw.trips;
    else if(typeof raw.trips === 'object') tripsObj = raw.trips;
  } else if(typeof raw === 'object'){
    // top-level keyed
    var keys = Object.keys(raw);
    if(keys.length && keys.every(function(k){ return raw[k] && typeof raw[k]==='object'; })){
      tripsObj = {};
      keys.forEach(function(k){ tripsObj[k] = raw[k]; });
    }
  }
  if(!tripsObj) return out;
  
  function processTrip(id, t){
    if(!t || typeof t !== 'object') return;
    var routeSrc = t.route || t.cities || [];
    if(!Array.isArray(routeSrc)) routeSrc = [];
    var route = [];
    routeSrc.forEach(function(s, i){
      if(!s) return;
      var city = s.city || s.name || '';
      var lat = s.lat;
      var lng = s.lng;
      var r = {
        city: city,
        lat: (typeof lat === 'number' && isFinite(lat)) ? lat : null,
        lng: (typeof lng === 'number' && isFinite(lng)) ? lng : null,
        transport: s.transport || s.arrive_by || '',
        days: Array.isArray(s.days) ? s.days : (s.day != null ? [s.day] : (s.days != null ? [s.days] : [])),
        day: (s.day != null) ? s.day : (Array.isArray(s.days) ? s.days[0] : (s.days != null ? s.days : null)),
        note: s.note || ''
      };
      route.push(r);
    });
    
    var moments = Array.isArray(t.moments) ? t.moments : null;
    if(moments && !route.length){
      var seen = {};
      moments.forEach(function(m){
        if(!m || seen[m.city]) return; seen[m.city] = 1;
        route.push({city: m.city || '', lat: typeof m.lat === 'number' ? m.lat : null, lng: typeof m.lng === 'number' ? m.lng : null, transport: '', days: [], day: null, note: ''});
      });
    }
    var daysSrc = t.days || t.itinerary || (moments ? moments.map(function(m){ return {city: m.city, lat: m.lat, lng: m.lng, text: m.text, label: m.season || ''}; }) : []);
    if(!Array.isArray(daysSrc)) daysSrc = [];
    var days = [];
    daysSrc.forEach(function(d, i){
      if(!d) return;
      var city = d.city || d.name || '';
      var lat = d.lat, lng = d.lng;
      if((typeof lat !== 'number' || !isFinite(lat)) || (typeof lng !== 'number' || !isFinite(lng))){
        // lookup from route
        for(var ri=0;ri<route.length;ri++){
          if(route[ri].city === city && route[ri].lat != null){
            if(typeof lat !== 'number' || !isFinite(lat)) lat = route[ri].lat;
            if(typeof lng !== 'number' || !isFinite(lng)) lng = route[ri].lng;
            break;
          }
        }
      }
      var note = d.note || d.text || d.summary || '';
      var photos = d.photos || null;
      var place = d.place || '';
      var dn = (d.day != null) ? d.day : (d.n != null ? d.n : i+1);
      var stopIdx = -1, tr = d.transport || '';
      for(var si=0; si<route.length; si++){ if(route[si].days.indexOf(dn) >= 0 && route[si].city === city){ stopIdx = si; break; } }
      if(stopIdx < 0){ for(var sj=0; sj<route.length; sj++){ if(route[sj].city === city){ stopIdx = sj; break; } } }
      if(!tr && stopIdx >= 0 && route[stopIdx].days[0] === dn) tr = route[stopIdx].transport || '';
      days.push({
        label: d.label || '',
        stop: stopIdx,
        title: d.title || '',
        weather: d.weather || '',
        stay: d.stay || '',
        day: (d.day != null) ? d.day : (d.n != null ? d.n : i+1),
        date: d.date || '',
        city: city,
        lat: (typeof lat === 'number' && isFinite(lat)) ? lat : null,
        lng: (typeof lng === 'number' && isFinite(lng)) ? lng : null,
        note: note,
        transport: tr,
        photos: photos,
        place: place
      });
    });
    
    var derivedDays = false;
    if(!days.length && route.length && !(Array.isArray(t.visits) && t.visits.length)){
      derivedDays = true;
      route.forEach(function(r, i){
        days.push({
          day: (r.day != null) ? r.day : (i+1),
          date: '',
          city: r.city,
          lat: r.lat,
          lng: r.lng,
          note: r.note || '',
          transport: r.transport || '',
          stop: i,
          photos: null,
          place: ''
        });
      });
    }
    
    out[id] = {route: route, days: days, derivedDays: derivedDays, visits: Array.isArray(t.visits) ? t.visits : [], summary: t.summary || ''};
  }
  
  if(Array.isArray(tripsObj)){
    tripsObj.forEach(function(t){
      if(!t) return;
      var id = t.id || t.tripId || t.trip;
      if(!id) return;
      processTrip(id, t);
    });
  } else {
    Object.keys(tripsObj).forEach(function(id){
      processTrip(id, tripsObj[id]);
    });
  }
  return out;
}

// assign photos per day
function assignDayPhotos(trip, days){
  if(!days || !days.length) return;
  var tripPhotosArr = trip.tripPhotos || [];
  var assigned = new Set();
  var photosByDay = days.map(function(){ return []; });
  
  // 1) explicit day.photos
  days.forEach(function(d, i){
    if(!d.photos) return;
    if(Array.isArray(d.photos)){
      d.photos.forEach(function(p){
        if(typeof p === 'number'){
          if(p >= 0 && p < tripPhotosArr.length && !assigned.has(p)){
            photosByDay[i].push(tripPhotosArr[p]);
            assigned.add(p);
          }
        } else if(typeof p === 'string'){
          // match by src
          for(var pi=0;pi<tripPhotosArr.length;pi++){
            if(tripPhotosArr[pi].src === p && !assigned.has(pi)){
              photosByDay[i].push(tripPhotosArr[pi]);
              assigned.add(pi);
              break;
            }
          }
        }
      });
    }
  });
  
  // 2) by place id / city name, split evenly across consecutive days in that city
  // build consecutive groups per city/place
  var groups = [];
  var curGroup = null;
  days.forEach(function(d, i){
    var key = d.place || d.city;
    if(!key) { curGroup = null; return; }
    if(curGroup && curGroup.key === key){
      curGroup.indices.push(i);
    } else {
      curGroup = {key: key, indices: [i]};
      groups.push(curGroup);
    }
  });
  
  // for each place, find matching place id
  var placeByName = {};
  Object.keys(STATE.placesMap).forEach(function(pid){
    var p = STATE.placesMap[pid];
    placeByName[p.name] = pid;
  });
  
  groups.forEach(function(g){
    var placeId = g.key;
    if(!STATE.placesMap[placeId]){
      // try by name
      var alt = placeByName[g.key];
      if(alt) placeId = alt; else return;
    }
    var place = STATE.placesMap[placeId];
    if(!place || !place.photos) return;
    // indices of these photos in tripPhotosArr
    var tripPhotoIndices = [];
    tripPhotosArr.forEach(function(tp, idx){
      for(var pi=0;pi<place.photos.length;pi++){
        if(place.photos[pi].src === tp.src){ tripPhotoIndices.push(idx); break; }
      }
    });
    tripPhotoIndices = tripPhotoIndices.filter(function(i){ return !assigned.has(i); });
    if(!tripPhotoIndices.length) return;
    // split evenly
    var n = g.indices.length;
    var per = Math.floor(tripPhotoIndices.length / n);
    var rem = tripPhotoIndices.length - per*n;
    var cursor = 0;
    g.indices.forEach(function(dayIdx, gi){
      var cnt = per + (gi < rem ? 1 : 0);
      for(var k=0;k<cnt;k++){
        var pIdx = tripPhotoIndices[cursor++];
        if(pIdx != null && !assigned.has(pIdx)){
          photosByDay[dayIdx].push(tripPhotosArr[pIdx]);
          assigned.add(pIdx);
        }
      }
    });
  });
  
  // 3) remaining round-robin to days with none, else last day
  var remaining = [];
  tripPhotosArr.forEach(function(tp, i){
    if(!assigned.has(i)) remaining.push(i);
  });
  if(remaining.length){
    var emptyDays = [];
    photosByDay.forEach(function(list, i){ if(!list.length) emptyDays.push(i); });
    if(emptyDays.length){
      remaining.forEach(function(pIdx, k){
        var dayIdx = emptyDays[k % emptyDays.length];
        photosByDay[dayIdx].push(tripPhotosArr[pIdx]);
        assigned.add(pIdx);
      });
    } else {
      var lastIdx = days.length-1;
      remaining.forEach(function(pIdx){
        photosByDay[lastIdx].push(tripPhotosArr[pIdx]);
        assigned.add(pIdx);
      });
    }
  }
  
  // write back
  days.forEach(function(d, i){ d.photos = photosByDay[i]; });
}

// ---------- page transitions ----------
function animateRoute(cb){
  var app = document.getElementById('app');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ cb(); return; }
  app.classList.add('leaving');
  setTimeout(function(){
    cb();
    app.classList.remove('leaving');
    app.classList.add('entering');
    // scroll restore happens in router while hidden
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        app.classList.remove('entering');
        app.classList.add('entered');
        setTimeout(function(){ app.classList.remove('entered'); }, 350);
      });
    });
  }, 280);
}

// ---------- reveal ----------
var revealIO = null;
function initReveal(){
  document.documentElement.classList.add('js-reveal');
  revealIO = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){ e.target.classList.add('on'); revealIO.unobserve(e.target); }
    });
  }, {threshold:0.08});
}
function attachReveal(root){
  if(!revealIO) return;
  var els = root.querySelectorAll('.reveal');
  var vh = window.innerHeight;
  els.forEach(function(el){
    var r = el.getBoundingClientRect();
    if(r.top < vh * 0.95 && r.bottom > 0){ el.classList.add('on'); }
    else revealIO.observe(el);
  });
}

// ---------- router ----------
function parseHash(){
  var h = location.hash || '';
  if(h === '' || h === '#/' || h === '#') return {view:'world'};
  if(h === '#/china') return {view:'china'};
  var m = h.match(/^#\/trip\/(.+)$/);
  if(m) return {view:'detail', id:decodeURIComponent(m[1])};
  return {view:'world'};
}

function setScrollPos(view, y){
  if(view==='world') STATE.homeScroll = y;
  else if(view==='china') STATE.chinaScroll = y;
}
function getScrollPos(view){
  return view==='china' ? STATE.chinaScroll : STATE.homeScroll;
}

function router(){
  var route = parseHash();
  document.body.classList.remove('detail');
  document.getElementById('detailBar').classList.add('hidden');
  document.getElementById('topbar').classList.remove('hidden');
  document.getElementById('detailBar').classList.add('hidden');

  if(route.view === 'world'){
    STATE.currentView = 'world';
    document.body.classList.remove('view-china');
    document.getElementById('switch').querySelectorAll('span').forEach(function(s){
      s.classList.toggle('on', s.dataset.view === 'world');
    });
    renderHome();
    window.scrollTo(0, STATE.homeScroll || 0);
    updateScrolled();
  } else if(route.view === 'china'){
    STATE.currentView = 'china';
    document.body.classList.add('view-china');
    document.getElementById('switch').querySelectorAll('span').forEach(function(s){
      s.classList.toggle('on', s.dataset.view === 'china');
    });
    renderChina();
    window.scrollTo(0, STATE.chinaScroll || 0);
    updateScrolled();
  } else if(route.view === 'detail'){
    document.body.classList.remove('view-china');
    STATE.returnView = STATE.currentView === 'china' ? 'china' : 'world';
    renderDetail(route.id);
    window.scrollTo(0, 0);
    updateScrolled();
  }
  syncMusicVolume();
}

function navigate(hash){
  if(location.hash === hash) { router(); return; }
  location.hash = hash;
}

window.addEventListener('hashchange', function(){
  var prevRoute = STATE.currentView;
  if(!document.body.classList.contains('detail')){
    setScrollPos(prevRoute, window.scrollY);
  }
  animateRoute(function(){ router(); });
});

// parallax
var heroEl = null, heroImg = null;
function doParallax(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if(window.matchMedia('(max-width:640px)').matches) return;
  // trip figures parallax
  var app = document.getElementById('app');
  if(!app) return;
  var vh = window.innerHeight;
  app.querySelectorAll('.trip figure .img-wrap, .bleed img, .china-card figure .img-wrap').forEach(function(w){
    var img = w.tagName === 'IMG' ? w : w.querySelector('img');
    if(!img) return;
    var r = w.getBoundingClientRect();
    if(r.bottom < 0 || r.top > vh) return;
    var center = r.top + r.height/2;
    var p = (center - vh/2) / (vh/2 + r.height/2); // -1..1
    var ty = p * 18; // +18..-18
    img.style.transform = 'translateY(' + (-ty) + 'px) scale(1.06)';
  });
  // hero parallax
  if(heroImg && heroEl){
    var y = window.scrollY;
    if(y <= heroEl.offsetHeight){
      heroImg.style.transform = 'translateY(' + (y * 0.25) + 'px) scale(1.02)';
    }
  }
}

// ---------- LQIP helper ----------
function wrapImg(src, alt, opts){
  opts = opts || {};
  var thumb = opts.thumb || thumbURL(src.replace(/^public\//,''));
  var full = /^public\//.test(src) ? src : 'public/' + src;
  var thumbPath = /^public\//.test(thumb) ? thumb : 'public/' + thumb;
  var cls = opts.cls || '';
  var style = opts.style || '';
  var loading = opts.loading || 'lazy';
  var fetchpri = opts.fetchpriority ? ' fetchpriority="' + opts.fetchpriority + '"' : '';
  return '<div class="img-wrap ' + cls + '" style="background-image:url(\'' + thumbPath + '\');' + style + '">' +
    '<img src="' + full + '" alt="' + esc(alt) + '" loading="' + loading + '"' + fetchpri + ' data-lqip="1" decoding="async">' +
    '</div>';
}

function attachLQIP(root){
  root.querySelectorAll('img[data-lqip]').forEach(function(img){
    function done(){ img.classList.add('loaded'); }
    if(img.complete && img.naturalWidth){ done(); }
    else {
      img.addEventListener('load', done, {once:true});
      img.addEventListener('error', done, {once:true});
    }
  });
}

// ---------- hero scroll hijack ----------
var heroScrollLock = false;
function scrollToFirstYear(){
  if(heroScrollLock) return;
  var target = document.querySelector('.year');
  if(!target) return;
  heroScrollLock = true;
  var startY = window.scrollY;
  var endY = target.getBoundingClientRect().top + window.scrollY - 64;
  var t0 = performance.now();
  var dur = 900;
  function frame(now){
    var p = Math.min(1, (now - t0)/dur);
    var e = p<0.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2,3)/2;
    window.scrollTo(0, startY + (endY-startY)*e);
    if(p < 1){ requestAnimationFrame(frame); }
    else { heroScrollLock = false; }
  }
  requestAnimationFrame(frame);
}
function setupHeroScrollHijack(){
  var home = parseHash().view === 'world';
  if(!home) return;
  var handler = function(e){
    if(heroScrollLock) { e.preventDefault(); return; }
    if(window.scrollY > window.innerHeight * 0.5) return;
    if(document.body.classList.contains('detail')) return;
    if(e.type === 'wheel' && e.deltaY > 0){ e.preventDefault(); scrollToFirstYear(); }
    if(e.type === 'keydown'){
      var k = e.key;
      if(k === 'PageDown' || k === ' ' || k === 'ArrowDown'){
        e.preventDefault(); scrollToFirstYear();
      }
    }
  };
  if(!window.__heroWheelBound){
    window.__heroWheelBound = true;
    window.addEventListener('wheel', handler, {passive:false});
    window.addEventListener('keydown', handler);
  }
  // touch
  var sy = 0, sxt = 0;
  window.addEventListener('touchstart', function(e){
    if(window.scrollY > window.innerHeight * 0.5) return;
    if(e.touches.length === 1){
      sy = e.touches[0].clientY;
      sxt = e.touches[0].clientX;
    }
  }, {passive:true});
  window.addEventListener('touchend', function(e){
    if(heroScrollLock) return;
    if(window.scrollY > window.innerHeight * 0.5) return;
    if(!e.changedTouches.length) return;
    var dy = e.changedTouches[0].clientY - sy;
    var dx = e.changedTouches[0].clientX - sxt;
    if(dy < -50 && Math.abs(dy) > Math.abs(dx)){
      scrollToFirstYear();
    }
  }, {passive:true});
}

function drawChinaMap(chinaPlaces){
  var el = document.getElementById('chinaMap');
  if(!el || !STATE.chinaGeo) return;
  var W = 760, H = 560;
  var svg = d3.select(el).append('svg')
    .attr('viewBox', '0 0 ' + W + ' ' + H)
    .attr('preserveAspectRatio', 'xMidYMid meet');

  var projection = d3.geoMercator();
  var path = d3.geoPath(projection);
  try { projection.fitExtent([[10,10],[W-10,H-10]], STATE.chinaGeo); } catch(e){}

  var visitedProv = {};
  chinaPlaces.forEach(function(p){ if(p.province) visitedProv[p.province] = 1; });

  svg.append('g').selectAll('path')
    .data(STATE.chinaGeo.features || [])
    .enter().append('path')
    .attr('class', function(d){
      var n = d.properties && d.properties.name;
      return 'prov' + (visitedProv[n] ? ' visited' : '');
    })
    .attr('d', path);

  var cityG = svg.append('g');
  chinaPlaces.forEach(function(p, i){
    if(p.lat == null || p.lng == null) return;
    var pt;
    try { pt = projection([p.lng, p.lat]); } catch(e){ return; }
    if(!pt) return;
    var g = cityG.append('g').attr('data-city-id', p.id);
    var dot = g.append('circle')
      .attr('class', 'city-dot')
      .attr('cx', pt[0]).attr('cy', pt[1]).attr('r', 3);
    var right = (i % 2 === 0);
    var lx = pt[0] + (right ? 9 : -9);
    var lbl = g.append('text')
      .attr('class', 'city-lbl')
      .attr('x', lx).attr('y', pt[1] + 4)
      .attr('text-anchor', right ? 'start' : 'end')
      .attr('data-city-id', p.id)
      .text(p.name);

    g.style('cursor','pointer');
    g.on('mouseenter', function(){
      dot.attr('r', 5);
      lbl.classed('hl', true);
      var card = document.querySelector('.china-card[data-city-id="' + p.id + '"]');
      if(card){ card.querySelector('.t-title').style.color = 'var(--accent)'; }
    }).on('mouseleave', function(){
      dot.attr('r', 3);
      lbl.classed('hl', false);
      var card = document.querySelector('.china-card[data-city-id="' + p.id + '"]');
      if(card){ card.querySelector('.t-title').style.color = ''; }
    }).on('click', function(){
      var card = document.querySelector('.china-card[data-city-id="' + p.id + '"]');
      if(card) card.scrollIntoView({behavior:'smooth', block:'center'});
    });
  });
}
