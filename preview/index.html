  var isTrip = trip.kind === 'trip';
  var idx = isTrip ? findTripIndex(id) : -1;
  var N = STATE.tripSeq.length;
  var prevTrip = (isTrip && idx > 0) ? STATE.tripSeq[idx-1] : null;
  var nextTrip = (isTrip && idx < N-1 && idx >= 0) ? STATE.tripSeq[idx+1] : null;

  var navHtml = '';
  if(prevTrip) navHtml += '<a href="#/trip/' + encodeURIComponent(prevTrip.id) + '">‹ ' + esc(prevTrip.title) + '</a>';
  if(nextTrip) navHtml += '<a href="#/trip/' + encodeURIComponent(nextTrip.id) + '">' + esc(nextTrip.title) + ' ›</a>';
  document.getElementById('detailNav').innerHTML = navHtml;

  var photos = tripPhotos(trip, STATE.placesMap);
  var hasPhotos = photos.length > 0;
  var story = STATE.story[id];
  var hasStory = story && story.days && story.days.length > 0;

  var coverSrc = '';
  var focusY = null;
  if(hasPhotos){
    if(trip.cover){ coverSrc = photoURL(trip.cover); }
    else { coverSrc = photoURL(photos[0].src); focusY = photos[0].focusY; }
  }

  var kicker = isTrip ? (pad(idx+1) + ' / ' + N) : (trip.subtitle || '');
  var metaParts = metaLine(trip);

  var html = '';

  if(hasPhotos && coverSrc){
    var objPos = focusY != null ? ('50% ' + (focusY*100) + '%') : '50% 50%';
    var relCover = coverSrc.replace(/^public\//,'');
    html += '<section class="detail-cover">';
    html += wrapImg(relCover, trip.title, {loading:'eager', fetchpriority:'high', style:'position:absolute;inset:0;'});
    html += '<div class="dtxt">';
    if(kicker) html += '<div class="kicker">' + esc(kicker) + '</div>';
    html += '<h1>' + esc(trip.title) + '</h1>';
    if(metaParts.length) html += '<div class="detail-meta">' + esc(metaParts.join(' · ')) + '</div>';
    html += '</div></section>';
  } else {
    html += '<section class="detail-head">';
    if(kicker) html += '<div class="kicker">' + esc(kicker) + '</div>';
    html += '<h1>' + esc(trip.title) + '</h1>';
    if(metaParts.length) html += '<div class="detail-meta">' + esc(metaParts.join(' · ')) + '</div>';
    html += '</section>';
  }

  // stats row
  var stats = [];
  if(isTrip){
    var days = inclusiveDays(trip.start, trip.end);
    if(days == null && trip.nights != null) days = trip.nights + 1;
    if(days != null) stats.push({num:days, lab:'天'});
  }
  if(trip.nights != null) stats.push({num:trip.nights, lab:'晚'});
  // 座城市
  var locatedCities = 0;
  if(story){
    var citySet = {};
    story.route.forEach(function(r){ if(r.lat != null && r.city) citySet[r.city] = 1; });
    locatedCities = Object.keys(citySet).length;
  }
  if(locatedCities) stats.push({num:locatedCities, lab:'座城市'});
  else if(trip.places && trip.places.length) stats.push({num:trip.places.length, lab:'座城市'});
  if(hasPhotos) stats.push({num:photos.length, lab:'张照片'});

  if(stats.length){
    html += '<div class="stats-row">';
    stats.forEach(function(s){
      html += '<div class="stat"><div class="num">' + esc(s.num) + '</div><div class="lab">' + esc(s.lab) + '</div></div>';
    });
    html += '</div>';
  }

  // itinerary
  if(hasStory){
    html += renderItinerary(trip, story);
  }

  // legacy facts row (only if no story)
  if(!hasStory){
    var factRows = [];
    var placeNames = (trip.places || []).map(function(pid){ var p = STATE.placesMap[pid]; return p ? p.name : null; }).filter(Boolean);
    if(placeNames.length) factRows.push({lab:'地点', val: placeNames.join('、')});
    if(hasPhotos) factRows.push({lab:'照片', val: photos.length + ' 张'});
    if(trip.nights != null) factRows.push({lab:'天数', val: (trip.nights + 1) + ' 天'});
    if(trip.kind === 'collection'){
      var provs = (trip.places||[]).map(function(pid){ var p = STATE.placesMap[pid]; return p && p.province; }).filter(Boolean);
      var uniq = provs.filter(function(v,i){return provs.indexOf(v)===i;});
      if(uniq.length) factRows.push({lab:'省份', val: uniq.join('、')});
    }
    if(factRows.length){
      html += '<div class="facts">';
      factRows.forEach(function(f){
        html += '<div><div class="f-lab">' + esc(f.lab) + '</div><div class="f-val">' + esc(f.val) + '</div></div>';
      });
      html += '</div>';
    }
  }

  // edinburgh visits
  if(trip.visits && trip.visits.length){
    html += '<div class="visits-list">';
    trip.visits.forEach(function(v){
      html += '<div class="v-row"><div class="v-date">' + esc(fmtRange(v.start, v.end)) + '</div>';
      var sv = ((STATE.story[trip.id] || {}).visits || []).find(function(x){ return x && x.start === v.start; });
      html += '<div class="v-note">' + esc(v.note || '') + (sv && sv.text ? '<p class="v-text">' + esc(sv.text) + '</p>' : '') + '</div></div>';
    });
    html += '</div>';
  }

  // uk-years stops
  if(trip.stops && trip.stops.length){
    html += '<div class="stops-line"><span class="s-lab">停靠</span>' + esc(trip.stops.map(function(s){return s.name;}).join(' → ')) + '</div>';
  }

  // place info + photos (legacy grid) - only when NO story (story has its own photos)
  if(!hasStory && trip.places && trip.places.length){
    html += '<section class="photos-sec">';
    trip.places.forEach(function(pid){
      var p = STATE.placesMap[pid];
      if(!p) return;
      var ph = p.photos || [];
      var hasMem = p.memory && p.memory.length;
      var hasDate = p.date;
      if(hasMem || hasDate){
        html += '<div class="place-info">';
        html += '<h4 class="pi-title">' + esc(p.name) + '</h4>';
        if(hasDate) html += '<div class="pi-date">' + esc(p.date) + '</div>';
        if(hasMem) html += '<div class="pi-memory">' + esc(p.memory) + '</div>';
        html += '</div>';
      }
      if(ph.length){
        if(trip.places.length > 1){
          html += '<div class="place-block"><div class="place-lab">' + esc(p.name) + '</div>';
        } else {
          html += '<div class="place-block">';
        }
        html += '<div class="photos-grid">';
        ph.forEach(function(photo, pi){
          var asp = (photo.w && photo.h) ? (photo.w + '/' + photo.h) : '4/5';
          var fullSrc = photo.src;
          var thumbSrc = photo.thumb || (photo.src ? photo.src.replace(/\.webp$/,'-thumb.webp') : '');
          html += '<figure class="p-item" data-photo-i="' + pi + '" data-place="' + esc(p.id) + '" style="aspect-ratio:' + asp + '">';
          html += wrapImg(fullSrc, p.name, {thumb: thumbSrc ? 'public/'+thumbSrc : '', loading:'lazy'});
          html += '</figure>';
        });
        html += '</div></div>';
      }
    });
    html += '</section>';
  }

  // footer nav
  html += '<div class="detail-foot">';
  if(prevTrip || nextTrip){
    html += '<div class="dnav2">';
    if(prevTrip){
      html += '<a href="#/trip/' + encodeURIComponent(prevTrip.id) + '"><div class="d-lab">‹ 上一段</div>';
      html += '<div class="d-title">' + esc(prevTrip.title) + '</div></a>';
    } else { html += '<div></div>'; }
    if(nextTrip){
      html += '<a href="#/trip/' + encodeURIComponent(nextTrip.id) + '" class="d-right"><div class="d-lab">下一段 ›</div>';
      html += '<div class="d-title">' + esc(nextTrip.title) + '</div></a>';
    } else { html += '<div></div>'; }
    html += '</div>';
  }
  html += '<div class="detail-end">下一站，还没决定</div>';
  html += '</div>';

  document.getElementById('app').innerHTML = html;
  document.title = trip.title + ' · 我们的足迹';

  attachLQIP(document.getElementById('app'));

  // legacy photo grid click handlers
  document.querySelectorAll('.p-item').forEach(function(fig){
    fig.addEventListener('click', function(){
      var pid = fig.getAttribute('data-place');
      var p = STATE.placesMap[pid];
      if(!p) return;
      var idxInPlace = parseInt(fig.getAttribute('data-photo-i'),10);
      var full = tripPhotos(trip, STATE.placesMap);
      var offset = 0;
      for(var i=0;i<(trip.places||[]).length;i++){
        if(trip.places[i] === pid) break;
        var pp = STATE.placesMap[trip.places[i]];
        if(pp && pp.photos) offset += pp.photos.length;
      }
      var fullIdx = offset + idxInPlace;
      var list = full.map(function(ph){ return Object.assign({}, ph, {src: photoURL(ph.src), thumb: thumbURL(ph.thumb||ph.src)}); });
      openLightbox(list, fullIdx, trip.title);
    });
  });

  // day photo click handlers
  document.querySelectorAll('[data-day-photo]').forEach(function(el){
    el.addEventListener('click', function(){
      var di = parseInt(el.getAttribute('data-day-photo'),10);
      var pi = parseInt(el.getAttribute('data-photo-idx'),10);
      openStoryDayPhoto(trip, story, di, pi);
    });
  });

  if(hasStory){
    setupDetailMap(trip, story);
    setupDayObserver();
  }

  attachReveal(document.getElementById('app'));
  setupDetailKeyboard(prevTrip, nextTrip);
  setupDetailSwipe(prevTrip, nextTrip);
  window.__ready = true;
}

// ---------- itinerary render ----------
function renderItinerary(trip, story){
  var html = '<section class="itin-sec">';
  html += '<div class="itin-lab">' + (story.days[0] && story.days[0].label ? '片段 · ' + story.days.length : '行程 · ' + story.days.length + ' 天') + '</div>';
  html += '<div class="itin-grid">';
  html += '<div class="itin-days">';
  story.days.forEach(function(d, i){
    var cityName = d.city || '';
    var kicker = d.label ? d.label : ('第 ' + (d.day || (i+1)) + ' 天');
    if(d.date){
      var nd = normDate(d.date);
      if(nd) kicker += ' · ' + (nd.m) + '.' + pad(nd.d);
    }
    var transportLine = '';
    if(d.transport){
      var fromCity = '';
      if(i > 0) fromCity = story.days[i-1].city || '';
      transportLine = d.transport + (fromCity ? ' · 从 ' + fromCity : '');
    }
    var photoList = d.photos || [];
    var hasPhoto = photoList.length > 0;
    html += '<div class="itin-day' + (hasPhoto ? '' : ' nophoto') + '" data-day="' + i + '"' + (d.lat!=null ? ' data-lat="'+d.lat+'" data-lng="'+d.lng+'"' : '') + '>';
    html += '<div class="day-kick">' + esc(kicker) + '</div>';
    if(cityName) html += '<h3 class="day-city">' + esc(cityName) + '</h3>';
    if(transportLine) html += '<div class="day-transport">' + esc(transportLine) + '</div>';
    if(d.title) html += '<div class="day-title">' + esc(d.title) + '</div>';
    if(d.note) html += '<div class="day-note">' + esc(d.note) + '</div>';
    var dm = [d.weather, d.stay].filter(Boolean).join(' · ');
    if(dm) html += '<div class="day-meta">' + esc(dm) + '</div>';
    if(hasPhoto){
      html += '<div class="day-photos">';
      var wide = (photoList.length % 2 === 1);
      photoList.forEach(function(ph, pi){
        var src = ph.src || '';
        var thumb = ph.thumb || (src ? src.replace(/\.webp$/,'-thumb.webp') : '');
        var cls = 'dp' + (wide && pi === 0 ? ' wide' : '');
        html += '<div class="' + cls + '" data-day-photo="' + i + '" data-photo-idx="' + pi + '">';
        html += wrapImg(src, cityName, {thumb: thumb ? 'public/'+thumb : '', loading:'lazy'});
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  html += '<div class="itin-map"><div class="dmap" id="dmap"></div></div>';
  html += '</div></section>';
  return html;
}

function openStoryDayPhoto(trip, story, di, pi){
  // build full trip photo list
  var full = tripPhotos(trip, STATE.placesMap);
  // find the day photo in full list
  var d = story.days[di];
  if(!d || !d.photos) return;
  var ph = d.photos[pi];
  if(!ph) return;
  var fullIdx = 0;
  for(var i=0;i<full.length;i++){
    if(full[i].src === ph.src){ fullIdx = i; break; }
  }
  var list = full.map(function(p){ return Object.assign({}, p, {src: photoURL(p.src), thumb: thumbURL(p.thumb||p.src)}); });
  openLightbox(list, fullIdx, trip.title);
}

// ---------- detail map ----------
var detailMapState = {proj:null, g:null, svg:null, routePts:[], cityDots:[], legs:[], currentDay:-1, tween:null};

function placeLabels(items, obstacles, bounds){
  // Generic greedy label placer in screen pixels
  if(!items || !items.length) return [];
  var segs = (obstacles && obstacles.segments) || [];
  var dots = (obstacles && obstacles.dots) || [];
  var boxes = (obstacles && obstacles.boxes) || [];
  var bx0 = bounds.x0 + 4, by0 = bounds.y0 + 4, bx1 = bounds.x1 - 4, by1 = bounds.y1 - 4;

  // segment–rect intersection
  function segRectIntersect(x1,y1,x2,y2, r){
    // Liang-Barsky
    var dx = x2 - x1, dy = y2 - y1;
    var t0 = 0, t1 = 1;
    var p = [-dx, dx, -dy, dy];
    var q = [x1 - r.x0, r.x1 - x1, y1 - r.y0, r.y1 - y1];
    for(var i=0;i<4;i++){
      if(p[i] === 0){
        if(q[i] < 0) return false;
      } else {
        var t = q[i] / p[i];
        if(p[i] < 0){ if(t > t1) return false; if(t > t0) t0 = t; }
        else { if(t < t0) return false; if(t < t1) t1 = t; }
      }
    }
    return true;
  }

  function rectsOverlap(a, b, gap){
    gap = gap || 0;
    return !(a.x1 + gap < b.x0 || a.x0 - gap > b.x1 || a.y1 + gap < b.y0 || a.y0 - gap > b.y1);
  }

  function buildCandidates(item){
    var r = item.r || 3;
    var w = item.w || 40, h = item.h || 11;
    var x = item.x, y = item.y;
    var pref = item.pref || 'right';
    var off1 = r + 6, off2 = r + 18;
    var cands = [];
    function push(side, dist, leader){
      var box, ax, ay, anchor;
      if(side === 'right'){
        ax = x + dist; ay = y; anchor = 'start';
        box = {x0: ax, y0: ay - h/2, x1: ax + w, y1: ay + h/2};
      } else if(side === 'left'){
        ax = x - dist; ay = y; anchor = 'end';
        box = {x0: ax - w, y0: ay - h/2, x1: ax, y1: ay + h/2};
      } else if(side === 'above'){
        ax = x; ay = y - dist - h/2; anchor = 'middle';
        box = {x0: ax - w/2, y0: ay - h/2, x1: ax + w/2, y1: ay + h/2};
      } else { // below
        ax = x; ay = y + dist + h/2; anchor = 'middle';
        box = {x0: ax - w/2, y0: ay - h/2, x1: ax + w/2, y1: ay + h/2};
      }
      cands.push({x:ax, y:ay, anchor:anchor, leader:leader, box:box, side:side});
    }
    var other = pref === 'right' ? 'left' : 'right';
    push(pref, off1, false);
    push(other, off1, false);
    push('above', off1 - r + (r), false); // ensure gap: dist = r+4 effectively via off? use r+4
    // Recompute above/below with correct offset r+4:
    // (push above/below uses dist as center offset; use r+4 gap meaning bottom at y-r-4 => center at y-r-4-h/2)
    cands[cands.length-2].y = y - r - 4 - h/2;
    cands[cands.length-2].box = {x0: x - w/2, y0: y - r - 4 - h, x1: x + w/2, y1: y - r - 4};
    push('below', 0, false);
    cands[cands.length-1].y = y + r + 4 + h/2;
    cands[cands.length-1].box = {x0: x - w/2, y0: y + r + 4, x1: x + w/2, y1: y + r + 4 + h};
    // double-distance leaders
    push(pref, off2, true);
    push(other, off2, true);
    push('above', 0, true);
    cands[cands.length-1].y = y - r - 18 - h/2;
    cands[cands.length-1].box = {x0: x - w/2, y0: y - r - 18 - h, x1: x + w/2, y1: y - r - 18};
    push('below', 0, true);
    cands[cands.length-1].y = y + r + 18 + h/2;
    cands[cands.length-1].box = {x0: x - w/2, y0: y + r + 18, x1: x + w/2, y1: y + r + 18 + h};
    return cands;
  }

  function countConflicts(cand, item, placed){
    var c = 0;
    var box = cand.box;
    // bounds
    if(box.x0 < bx0 || box.y0 < by0 || box.x1 > bx1 || box.y1 > by1) c += 1;
    // placed labels
    for(var i=0;i<placed.length;i++){
      if(rectsOverlap(box, placed[i].box, 2)) c += 1;
    }
    // dots (skip own)
    for(var j=0;j<dots.length;j++){
      var d = dots[j];
      if(d === item || (d.x === item.x && d.y === item.y)) continue;
      var dr = d.r || 2;
      var db = {x0: d.x - dr, y0: d.y - dr, x1: d.x + dr, y1: d.y + dr};
      if(rectsOverlap(box, db, 2)) c += 1;
    }
    // obstacle boxes
    for(var k=0;k<boxes.length;k++){
      if(rectsOverlap(box, boxes[k], 2)) c += 1;
    }
    // segments
    var rInflated = {x0: box.x0 - 2, y0: box.y0 - 2, x1: box.x1 + 2, y1: box.y1 + 2};
    for(var s=0;s<segs.length;s++){
      var sg = segs[s];
      if(segRectIntersect(sg[0], sg[1], sg[2], sg[3], rInflated)) c += 1;
    }
    return c;
  }

  function isRejected(cand, item, placed){
    var box = cand.box;
    if(box.x0 < bx0 || box.y0 < by0 || box.x1 > bx1 || box.y1 > by1) return true;
    for(var i=0;i<placed.length;i++){
      if(rectsOverlap(box, placed[i].box, 2)) return true;
    }
    for(var j=0;j<dots.length;j++){
      var d = dots[j];
      if(d === item || (d.x === item.x && d.y === item.y)) continue;
      var dr = d.r || 2;
      var db = {x0: d.x - dr, y0: d.y - dr, x1: d.x + dr, y1: d.y + dr};
      if(rectsOverlap(box, db, 2)) return true;
    }
    for(var k=0;k<boxes.length;k++){
      if(rectsOverlap(box, boxes[k], 2)) return true;
    }
    var rInflated = {x0: box.x0 - 2, y0: box.y0 - 2, x1: box.x1 + 2, y1: box.y1 + 2};
    for(var s=0;s<segs.length;s++){
      var sg = segs[s];
      if(segRectIntersect(sg[0], sg[1], sg[2], sg[3], rInflated)) return true;
    }
    return false;
  }

  var placed = [];
  var result = [];
  for(var ii=0; ii<items.length; ii++){
    var item = items[ii];
    var cands = buildCandidates(item);
    var chosen = null, conflict = false;
    for(var c=0;c<cands.length;c++){
      if(!isRejected(cands[c], item, placed)){ chosen = cands[c]; break; }
    }
    if(!chosen){
      conflict = true;
      // pick candidate with fewest conflicts
      var best = cands[0], bestScore = Infinity;
      for(var c2=0;c2<cands.length;c2++){
        var score = countConflicts(cands[c2], item, placed);
        if(score < bestScore){ bestScore = score; best = cands[c2]; }
      }
      chosen = best;
    }
    var out = {x: chosen.x, y: chosen.y, anchor: chosen.anchor, leader: chosen.leader, box: chosen.box, conflict: conflict};
    placed.push(out);
    result.push(out);
  }
  return result;
}

function setupDetailMap(trip, story){
  var el = document.getElementById('dmap');
  if(!el || !STATE.worldGeo) return;
  var route = story.route || [];
  var located = route.filter(function(r){ return r.lat != null && r.lng != null; });

  el.innerHTML = '';
  var w = el.clientWidth || 600, h = el.clientHeight || 500;
  var svg = d3.select(el).append('svg')
    .attr('viewBox', '0 0 ' + w + ' ' + h)
    .attr('preserveAspectRatio', 'xMidYMid meet');

  // --- bbox from unique located cities ---
  var seenU = {};
  var uniq = [];
  located.forEach(function(r){
    var key = (r.city || '') + '|';
    if(!seenU[key]){ seenU[key] = 1; uniq.push(r); }
  });
  var bbox;
  if(uniq.length >= 2){
    var lngs = uniq.map(function(r){return r.lng;});
    var lats = uniq.map(function(r){return r.lat;});
    var minLng = Math.min.apply(null, lngs), maxLng = Math.max.apply(null, lngs);
    var minLat = Math.min.apply(null, lats), maxLat = Math.max.apply(null, lats);
    var dLng = maxLng - minLng, dLat = maxLat - minLat;
    var cLng = (minLng + maxLng)/2, cLat = (minLat + maxLat)/2;
    // ensure min span
    var spanLng = Math.max(dLng, 1.2);
    var spanLat = Math.max(dLat, 1.2);
    // pad 25% of span each side
    var padLng = spanLng * 0.25, padLat = spanLat * 0.25;
    detailMapState.span = Math.max(spanLng, spanLat);
    bbox = [[cLng - spanLng/2 - padLng, cLat - spanLat/2 - padLat],
            [cLng + spanLng/2 + padLng, cLat + spanLat/2 + padLat]];
  } else if(uniq.length === 1){
    var r0 = uniq[0];
    detailMapState.span = 0;
    bbox = [[r0.lng - 1.2, r0.lat - 0.8], [r0.lng + 1.2, r0.lat + 0.8]];
  } else {
    bbox = [[-20, -20], [20, 20]];
    detailMapState.span = 40;
  }

  var cornersMP = {
    type: 'MultiPoint',
    coordinates: [
      [bbox[0][0], bbox[0][1]],
      [bbox[1][0], bbox[0][1]],
      [bbox[1][0], bbox[1][1]],
      [bbox[0][0], bbox[1][1]]
    ]
  };

  var proj = d3.geoMercator();
  try {
    proj.fitExtent([[24,24],[w-24,h-24]], cornersMP);
  } catch(e){
    try { proj.fitExtent([[24,24],[w-24,h-24]], {type:'Sphere'}); } catch(e2){}
  }

  var path = d3.geoPath(proj);

  var tripCountries = {};
  (trip.countries||[]).forEach(function(c){ tripCountries[globeCountry(c)] = 1; });

  var zoomG = svg.append('g').attr('class', 'zoom-g');
  var countriesG = zoomG.append('g');
  countriesG.selectAll('path')
    .data(STATE.worldGeo.features || [])
    .enter().append('path')
    .attr('class', function(d){
      var n = d.properties && d.properties.name;
      return 'country' + (tripCountries[n] ? ' trip' : '');
    })
    .attr('d', path);

  // --- unique city dedup for dots/labels ---
  var uniqCities = [];
  var uniqMap = {};
  var stopToUniq = [];
  located.forEach(function(r){
    var key = r.city || (r.lng + ',' + r.lat);
    var idx = uniqMap[key];
    if(idx == null){
      idx = uniqCities.length;
      uniqMap[key] = idx;
      uniqCities.push({city: r.city, lng: r.lng, lat: r.lat});
    }
    stopToUniq.push(idx);
  });

  // route points (all stops, in order)
  var routePts = located.map(function(r){ return [r.lng, r.lat, r.city]; });

  // legs from great-circle samples
  var legs = [];
  for(var i=1;i<routePts.length;i++){
    var a = routePts[i-1], b = routePts[i];
    var interp = d3.geoInterpolate([a[0],a[1]],[b[0],b[1]]);
    var samples = [];
    for(var s=0;s<=24;s++){ samples.push(interp(s/24)); }
    legs.push({samples:samples, from:a, to:b});
  }

  // Combined route path
  var combined = [];
  legs.forEach(function(leg, li){
    leg.samples.forEach(function(p, idx){
      if(li>0 && idx===0) return;
      combined.push(p);
    });
  });

  var routeEl = zoomG.append('path')
    .attr('class','leg')
    .attr('d', (combined.length ? path({type:'LineString', coordinates: combined}) : 'M0,0'))
    .attr('fill','none');

  zoomG.selectAll('.leg-seg').remove();
  var legEls = [];
  legs.forEach(function(leg, li){
    var legPath = path({type:'LineString', coordinates: leg.samples});
    var el2 = zoomG.append('path')
      .attr('class','leg leg-seg')
      .attr('d', legPath || 'M0,0')
      .attr('data-leg', li);
    legEls.push(el2);
  });
  routeEl.remove();
  legEls.forEach(function(e2){ e2.node().style.transition = 'none'; });

  var legLens = [];
  var totalL = 0;
  legEls.forEach(function(e2){
    var L = 0;
    try { L = e2.node().getTotalLength(); } catch(er){ L = 0; }
    legLens.push(L);
    totalL += L;
    e2.node().style.strokeDasharray = L;
    e2.node().style.strokeDashoffset = L;
  });

  // leader group (before cities so leaders under dots/labels)
  var leaderG = zoomG.append('g').attr('class','leaders');

  // city dots & labels (unique only)
  var cityG = zoomG.append('g').attr('class','cities');
  var dots = [];
  uniqCities.forEach(function(u, ui){
    var pt = proj([u.lng, u.lat]);
    if(!pt) return;
    var g = cityG.append('g');
    var dot = g.append('circle')
      .attr('class','city-dot')
      .attr('cx', pt[0]).attr('cy', pt[1]).attr('r', 4)
      .attr('data-idx', ui);
    var lbl = g.append('text')
      .attr('class','city-lbl')
      .attr('text-anchor','start')
      .attr('x', 9).attr('y', 0)
      .text(u.city || '');
    // leader line (in screen space, since label is counter-scaled it uses offsets in screen px)
    var leader = leaderG.append('line')
      .attr('class','city-leader')
      .attr('x1', pt[0]).attr('y1', pt[1])
      .attr('x2', pt[0]).attr('y2', pt[1])
      .style('display','none');
    dots.push({g:g, dot:dot, lbl:lbl, leader:leader, pt:pt, idx:ui, city:u.city, lng:u.lng, lat:u.lat});
    g.style('opacity', 0);
  });

  detailMapState.proj = proj;
  detailMapState.svg = svg;
  detailMapState.g = zoomG;
  detailMapState.w = w;
  detailMapState.h = h;
  detailMapState.legEls = legEls;
  detailMapState.dots = dots;
  detailMapState.routePts = routePts;
  detailMapState.uniqCities = uniqCities;
  detailMapState.stopToUniq = stopToUniq;
  detailMapState.legs = legs;
  detailMapState.currentDay = -1;
  // day -> unique city dot index
  var d2s = [], cursor = 0;
  (story.days || []).forEach(function(d){
    var found = -1;
    if(d.stop != null && d.stop >= 0 && d.stop < route.length){
      // find its down-index among located
      var cnt = -1;
      for(var ri=0; ri<=d.stop && ri<route.length; ri++){
        if(route[ri].lat != null && route[ri].lng != null) cnt++;
      }
      if(cnt >= 0 && cnt < stopToUniq.length) found = stopToUniq[cnt];
    }
    if(found < 0){
      for(var k = cursor; k < uniqCities.length; k++){ if(uniqCities[k].city === d.city){ found = k; break; } }
    }
    if(found < 0){ for(var k2 = 0; k2 < uniqCities.length; k2++){ if(uniqCities[k2].city === d.city){ found = k2; break; } } }
    if(found >= 0) cursor = found;
    d2s.push(found);
  });
  detailMapState.dayToStop = d2s;
  detailMapState.tween = null;

  // store projected segments for label collision
  var projSegs = [];
  legs.forEach(function(leg){
    var prev = null;
    for(var s=0;s<leg.samples.length;s++){
      var pp = proj(leg.samples[s]);
      if(!pp) { prev = null; continue; }
      if(prev) projSegs.push([prev[0], prev[1], pp[0], pp[1]]);
      prev = pp;
    }
  });
  detailMapState.projSegs = projSegs;

  animateDetailRoute(legLens, dots);

  zoomG.attr('transform','translate(0,0) scale(1)');

  // after draw settles, run label placement
  setTimeout(function(){ updateDetailLabels(); }, 1650);

  window.__detailZoomToDay = function(dayIdx){ zoomToDay(dayIdx); };
}

function animateDetailRoute(legLens, dots){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.__settled = false;
  if(reduce){
    detailMapState.legEls.forEach(function(e){ e.node().style.strokeDashoffset = 0; });
    dots.forEach(function(d){ d.g.style('opacity',1); });
    window.__settled = true;
    updateDetailLabels();
    return;
  }
  var start = performance.now();
  var dur = 1600;
  var total = legLens.reduce(function(a,b){return a+b;},0);
  if(total === 0){ window.__settled = true; updateDetailLabels(); return; }
  var dotProgress = [];
  var cum = 0;
  legLens.forEach(function(L, i){
    cum += L;
    dotProgress.push(cum / total);
  });
  dotProgress.unshift(0);
  // unique dots: place based on cumulative progress by stop count (approx)
  var els = detailMapState.legEls, token = detailMapState.drawToken = {};
  function frame(now){
    if(detailMapState.drawToken !== token){ return; }
    var p = Math.min(1, (now - start)/dur);
    var eased = d3.easeCubicInOut(p);
    var drawn = total * eased;
    var acc = 0;
    legLens.forEach(function(L, i){
      var el = els[i].node();
      var visible = Math.max(0, Math.min(L, drawn - acc));
      el.style.strokeDashoffset = (L - visible);
      acc += L;
    });
    dots.forEach(function(d, i){
      var dp = (dots.length > 1) ? (i / (dots.length - 1)) : 0;
      d.g.style('opacity', eased >= dp - 0.001 ? 1 : 0);
    });
    if(p < 1){
      requestAnimationFrame(frame);
    } else {
      window.__settled = true;
      updateDetailLabels();
    }
  }
  requestAnimationFrame(frame);
}

function setupDayObserver(){
  var days = document.querySelectorAll('.itin-day');
  if(!days.length) return;
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting && e.intersectionRatio > 0){
        var idx = parseInt(e.target.getAttribute('data-day'), 10);
        if(idx !== detailMapState.currentDay){
          detailMapState.currentDay = idx;
          if(window.__detailZoomToDay) window.__detailZoomToDay(idx);
          document.querySelectorAll('.itin-day').forEach(function(el, i){
            el.classList.toggle('cur', i === idx);
          });
        }
      }
    });
  }, {rootMargin: window.matchMedia('(max-width:640px)').matches ? '-58% 0px -38% 0px' : '-40% 0px -55% 0px', threshold:0});
  days.forEach(function(d){ io.observe(d); });
  if(window.__detailZoomToDay) window.__detailZoomToDay(-1);
}

function zoomToDay(dayIdx){
  if(!detailMapState.proj) return;
  var proj = detailMapState.proj;
  var w = detailMapState.w, h = detailMapState.h;
  var g = detailMapState.g;
  if(!g) return;

  var targetK = 1, targetTx = 0, targetTy = 0;
  var targetDot = null;
  var d2s = detailMapState.dayToStop || [];
  if(dayIdx >= 0) dayIdx = d2s[dayIdx] != null ? d2s[dayIdx] : dayIdx;

  // decide targetK
  var uniqN = (detailMapState.uniqCities || []).length;
  var span = detailMapState.span || 0;
  if(dayIdx >= 0 && dayIdx < detailMapState.dots.length){
    targetDot = detailMapState.dots[dayIdx];
  }
  if(uniqN <= 2 || span < 4){
    targetK = 1;
  } else {
    targetK = Math.min(1.8, 1 + span/12);
  }

  if(targetK > 1 && targetDot){
    var pt = targetDot.pt;
    targetTx = w/2 - pt[0]*targetK;
    targetTy = h/2 - pt[1]*targetK;
  } else {
    targetK = 1; targetTx = 0; targetTy = 0;
  }

  // update dot emphasis
  detailMapState.dots.forEach(function(d, i){
    var isCur = (i === dayIdx);
    d.dot.attr('r', isCur ? 6 : 4);
    d.lbl.classed('cur', isCur);
    d.lbl.style('font-size', isCur ? '15px' : '13px');
    d.g.classed('cur', isCur);
  });

  // update leg colors
  detailMapState.legEls.forEach(function(e, i){
    e.classed('done', i < dayIdx);
  });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){
    g.attr('transform', 'translate(' + targetTx + ',' + targetTy + ') scale(' + targetK + ')');
    updateCounterScale();
    updateDetailLabels();
    return;
  }

  if(detailMapState.tween){
    cancelAnimationFrame(detailMapState.tween);
    detailMapState.tween = null;
  }

  var cur = g.node().getAttribute('transform') || 'translate(0,0) scale(1)';
  var m = cur.match(/translate\(([-\d.]+),([-\d.]+)\)\s*scale\(([-\d.]+)\)/);
  var fromK = 1, fromTx = 0, fromTy = 0;
  if(m){ fromTx = parseFloat(m[1]); fromTy = parseFloat(m[2]); fromK = parseFloat(m[3]); }

  var t0 = performance.now();
  var dur = 700;
  window.__settled = false;
  function frame(now){
    var p = Math.min(1, (now-t0)/dur);
    var e = d3.easeCubicInOut(p);
    var k = fromK + (targetK - fromK)*e;
    var tx = fromTx + (targetTx - fromTx)*e;
    var ty = fromTy + (targetTy - fromTy)*e;
    g.attr('transform', 'translate(' + tx + ',' + ty + ') scale(' + k + ')');
    updateCounterScale();
    if(p < 1){
      detailMapState.tween = requestAnimationFrame(frame);
    } else {
      detailMapState.tween = null;
      window.__settled = true;
      updateDetailLabels();
    }
  }
  detailMapState.tween = requestAnimationFrame(frame);
}

// counter-scale labels and dots based on zoom
function updateCounterScale(){
  if(!detailMapState.g) return;
  var m = detailMapState.g.node().getAttribute('transform') || '';
  var mm = m.match(/scale\(([-\d.]+)\)/);
  var k = mm ? parseFloat(mm[1]) : 1;
  if(!detailMapState.dots) return;
  detailMapState.dots.forEach(function(d){
    var inv = 1/k;
    d.dot.attr('transform', 'translate(' + d.pt[0] + ',' + d.pt[1] + ') scale(' + inv + ') translate(' + (-d.pt[0]) + ',' + (-d.pt[1]) + ')');
    d.lbl.attr('transform', 'translate(' + d.pt[0] + ',' + d.pt[1] + ') scale(' + inv + ') translate(' + (-d.pt[0]) + ',' + (-d.pt[1]) + ')');
  });
}

// place labels in screen space for current transform
function updateDetailLabels(){
  if(!detailMapState.g || !detailMapState.dots || !detailMapState.proj) return;
  var g = detailMapState.g;
  var m = g.node().getAttribute('transform') || '';
  var mm = m.match(/translate\(([-\d.]+),([-\d.]+)\)\s*scale\(([-\d.]+)\)/);
  var k = 1, tx = 0, ty = 0;
  if(mm){ tx = parseFloat(mm[1]); ty = parseFloat(mm[2]); k = parseFloat(mm[3]); }

  var w = detailMapState.w, h = detailMapState.h;

  // current-day emphasis: ensure label font sizes are set (may have been changed)
  var curIdx = detailMapState.currentDay;
  var d2s = detailMapState.dayToStop || [];
  var curUniq = curIdx >= 0 ? (d2s[curIdx] != null ? d2s[curIdx] : curIdx) : -1;

  // measure each label width via getComputedTextLength
  var items = [];
  var dotsList = [];
  detailMapState.dots.forEach(function(d, i){
    var isCur = (i === curUniq);
    d.lbl.style('font-size', isCur ? '15px' : '13px');
    var screenX = d.pt[0]*k + tx;
    var screenY = d.pt[1]*k + ty;
    var tw = 40;
    try { tw = d.lbl.node().getComputedTextLength(); } catch(e){ tw = 40; }
    var th = isCur ? 15 : 13;
    items.push({x: screenX, y: screenY, w: tw, h: th, r: isCur ? 6 : 4, pref: (i % 2 === 0) ? 'right' : 'left', _i: i});
    dotsList.push({x: screenX, y: screenY, r: isCur ? 6 : 4, _i: i});
  });

  // route segments transformed to screen
  var segs = [];
  var projSegs = detailMapState.projSegs || [];
  for(var s=0;s<projSegs.length;s++){
    var sg = projSegs[s];
    segs.push([sg[0]*k + tx, sg[1]*k + ty, sg[2]*k + tx, sg[3]*k + ty]);
  }

  var obstacles = {segments: segs, dots: dotsList, boxes: []};
  var bx = Math.max(8, w * 0.1), by = Math.max(8, h * 0.1); // stay clear of the soft edge fade
  var bounds = {x0: bx, y0: by, x1: w - bx, y1: h - by};
  var placed = placeLabels(items, obstacles, bounds);

  // apply: label is inside counter-scaled group around dot, so x/y are offsets in screen px from dot
  placed.forEach(function(pl, ii){
    var i = items[ii]._i;
    var d = detailMapState.dots[i];
    var dx = pl.x - (d.pt[0]*k + tx);
    var dy = pl.y - (d.pt[1]*k + ty);
    d.lbl.attr('x', d.pt[0] + dx).attr('y', d.pt[1] + dy);
    d.lbl.attr('text-anchor', pl.anchor === 'start' ? 'start' : (pl.anchor === 'end' ? 'end' : 'middle'));
    d.lbl.attr('dominant-baseline', 'middle');
    if(pl.leader){
      d.leader.style('display', null);
      // leader in screen space: since dot is counter-scaled, we draw in outer coords
      d.leader.attr('x1', d.pt[0]).attr('y1', d.pt[1]);
      // end point: attach near label edge, in outer coords
      var ex, ey;
      if(pl.anchor === 'start'){ ex = pl.box.x0; ey = (pl.box.y0 + pl.box.y1)/2; }
      else if(pl.anchor === 'end'){ ex = pl.box.x1; ey = (pl.box.y0 + pl.box.y1)/2; }
      else { ex = (pl.box.x0 + pl.box.x1)/2; ey = (pl.box.y0 < d.pt[1]*k + ty) ? pl.box.y1 : pl.box.y0; }
      // leader line lives in outer coord space; not inside counter-scaled group, so use pt directly
      d.leader.attr('x1', d.pt[0]).attr('y1', d.pt[1]);
      d.leader.attr('x2', (ex - tx) / k).attr('y2', (ey - ty) / k);
    } else {
      d.leader.style('display','none');
    }
  });
}

// ---------- detail keyboard + swipe ----------
function setupDetailKeyboard(prevTrip, nextTrip){
  if(window.__detailKeyHandler){
    document.removeEventListener('keydown', window.__detailKeyHandler);
  }
  window.__detailKeyHandler = function(e){
    if(lb.isOpen) return;
    if(parseHash().view !== 'detail') return;
    if(e.key === 'ArrowLeft' && prevTrip){ navigate('#/trip/' + encodeURIComponent(prevTrip.id)); }
    else if(e.key === 'ArrowRight' && nextTrip){ navigate('#/trip/' + encodeURIComponent(nextTrip.id)); }
    else if(e.key === 'Escape'){ navigate(STATE.returnView === 'china' ? '#/china' : '#/'); }
  };
  document.addEventListener('keydown', window.__detailKeyHandler);
}

function setupDetailSwipe(prevTrip, nextTrip){
  var sx=0, sy=0, started=false, startTarget=null;
  document.addEventListener('touchstart', function(e){
    if(parseHash().view !== 'detail') return;
    if(lb.isOpen) return;
    if(e.touches.length !== 1) return;
    startTarget = e.target;
    if(startTarget && (startTarget.closest('.lb') || startTarget.closest('.itin-map') || startTarget.closest('.dmap'))) return;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    started = true;
  }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(!started) return;
    started = false;
    if(parseHash().view !== 'detail') return;
    if(lb.isOpen) return;
    if(!e.changedTouches.length) return;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 80 && Math.abs(dx) > 2*Math.abs(dy)){
      if(dx > 0 && prevTrip){ navigate('#/trip/' + encodeURIComponent(prevTrip.id)); }
      else if(dx < 0 && nextTrip){ navigate('#/trip/' + encodeURIComponent(nextTrip.id)); }
    }
  }, {passive:true});
}

// ---------- GLOBE ----------
var globe = {
  ctx:null, proj:null, dots:[], visited:null, cur:'摩洛哥', S:480, R:220,
  tween:null, raf:null, initialized:false,
  hoverRoute: null, hoverTween:null, hoverProgress:0, hoverStreak:null,
  baseR: 220, baseS: 480
};

function initGlobe(){
  var cv = document.getElementById('globe');
  if(!cv) return;
  var ctx = cv.getContext('2d');
  var S = 480, R = 220;
  globe.ctx = ctx; globe.S = S; globe.R = R;
  globe.proj = d3.geoOrthographic().scale(R).translate([S/2, S/2]).clipAngle(90);

  var vis = new Set();
  STATE.trips.forEach(function(t){ (t.countries||[]).forEach(function(c){ vis.add(globeCountry(c)); }); });
  STATE.placesList.forEach(function(p){ if(p.country) vis.add(globeCountry(p.country)); });
  globe.visited = vis;

  var feats = (STATE.worldGeo && STATE.worldGeo.features) || [];
  var filtered = [];
  feats.forEach(function(f){
    try { filtered.push({f:f, b:d3.geoBounds(f)}); } catch(e){}
  });
  var dots = [];
  var step = 3.2;
  for(var lat = -80; lat <= 84; lat += step){
    var cosLat = Math.cos(lat * Math.PI / 180);
    if(cosLat < 0.05) cosLat = 0.05;
    var lngStep = step / cosLat;
    for(var lng = -180; lng < 180; lng += lngStep){
      var pt = [lng, lat];
      for(var k=0;k<filtered.length;k++){
        var b = filtered[k].b;
        if(lng < b[0][0]-1 || lng > b[1][0]+1 || lat < b[0][1]-1 || lat > b[1][1]+1) continue;
        try {
          if(d3.geoContains(filtered[k].f, pt)){
            dots.push([lng, lat, filtered[k].f.properties.name]);
            break;
          }
        } catch(e){}
      }
    }
  }
  globe.dots = dots;

  globe.initialized = true;
  drawGlobe(globe.cur);

  cv.addEventListener('click', function(){
    var target = null;
    for(var i = STATE.tripSeq.length-1; i >= 0; i--){
      var t = STATE.tripSeq[i];
      if(globeCountry((t.countries&&t.countries[0])||'') === globe.cur){ target = t; break; }
    }
    if(target){
      var el = document.querySelector('[data-trip-id="' + target.id + '"]');
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    }
  });

  document.getElementById('miniLbl').addEventListener('click', function(){ cv.click(); });
}

function drawGlobe(countryName, extra){
  if(!globe.ctx) return;
  extra = extra || {};
  var zoom = extra.zoom || 1;
  var feats = STATE.worldGeo.features;
  var target = feats.find(function(f){ return f.properties.name === countryName; });
  var center;
  if(target){
    try { center = d3.geoCentroid(target); } catch(e){ center = [WORLD_FALLBACK.lng, WORLD_FALLBACK.lat]; }
  } else if(extra.centroid){
    center = extra.centroid;
  } else {
    center = [WORLD_FALLBACK.lng, WORLD_FALLBACK.lat];
  }
  
  if(!extra.keepRotate){
    var rot = [-center[0], -center[1] * 0.6];
    globe.proj.rotate(rot);
  }
  
  var S = globe.S, Rbase = globe.R, cvEl = globe.ctx.canvas;
  var px = S / Math.max(40, cvEl.clientWidth || 120);
  globe.px = px;
  globe.proj.scale(globe.R * zoom).translate([S/2, S/2]).clipAngle(90);
  
  var ctx = globe.ctx;
  ctx.clearRect(0,0,S,S);
  ctx.beginPath(); ctx.arc(S/2,S/2,Rbase,0,Math.PI*2);
  ctx.fillStyle = 'rgba(18,16,14,.78)'; ctx.fill();
  ctx.strokeStyle = 'rgba(237,230,218,.10)'; ctx.lineWidth = px; ctx.stroke();
  
  // clip to disc
  ctx.save();
  ctx.beginPath(); ctx.arc(S/2,S/2,Rbase,0,Math.PI*2); ctx.clip();
  
  var proj = globe.proj;
  // draw countries if zoom > 1.6
  if(zoom > 1.6){
    var path = d3.geoPath(proj, ctx);
    feats.forEach(function(f){
      var n = f.properties.name;
      var isTrip = extra.tripCountries && extra.tripCountries[n];
      ctx.beginPath();
      path(f);
      if(isTrip){
        ctx.fillStyle = 'rgba(201,162,122,.16)';
        ctx.strokeStyle = 'rgba(201,162,122,.4)';
      } else {
        ctx.fillStyle = 'rgba(237,230,218,.06)';
        ctx.strokeStyle = 'rgba(237,230,218,.10)';
      }
      ctx.lineWidth = 0.6 * px;
      ctx.fill();
      ctx.stroke();
    });
  } else {
    // dots
    var rot = proj.rotate();
    var centerPt = [-rot[0], -rot[1]];
    var dots = globe.dots, visited = globe.visited;
    for(var i=0;i<dots.length;i++){
      var d = dots[i];
      if(d3.geoDistance([d[0], d[1]], centerPt) > Math.PI/2) continue;
      var p = proj([d[0], d[1]]);
      if(!p) continue;
      var on = d[2] === countryName;
      var v = visited.has(d[2]);
      ctx.fillStyle = on ? '#C9A27A' : (v ? 'rgba(237,230,218,.55)' : 'rgba(237,230,218,.2)');
      ctx.beginPath();
      ctx.arc(p[0], p[1], (on ? 1.3 : 0.85) * px, 0, Math.PI*2);
      ctx.fill();
    }
  }
  
  // draw hover route
  if(extra.route && extra.route.length){
    drawHoverRoute(ctx, proj, extra.route, extra.routeProgress, extra.litCities, px);
  }
  
  ctx.restore();
}

function drawHoverRoute(ctx, proj, routeStops, progress, litCities, zoom){
  var px = zoom || 1; // zoom param is actually px (backing pixels per CSS px)
  var located = routeStops.filter(function(r){ return r.lat != null && r.lng != null; });
  if(!located.length) return;

  // Build segments from great-circle samples (full route)
  var segments = [];
  var routeSegs = []; // for label collision: [[x1,y1,x2,y2],...]
  var totalLen = 0;
  for(var i=1;i<located.length;i++){
    var a = [located[i-1].lng, located[i-1].lat];
    var b = [located[i].lng, located[i].lat];
    var interp = d3.geoInterpolate(a, b);
    var pts = [];
    for(var s=0;s<=24;s++){
      var gpt = interp(s/24);
      var pp = proj(gpt);
      if(pp) pts.push(pp);
    }
    var segLen = 0;
    for(var k=1;k<pts.length;k++){
      segLen += Math.hypot(pts[k][0]-pts[k-1][0], pts[k][1]-pts[k-1][1]);
      routeSegs.push([pts[k-1][0], pts[k-1][1], pts[k][0], pts[k][1]]);
    }
    segments.push({pts:pts, len:segLen});
    totalLen += segLen;
  }

  // dedupe cities for dots/labels
  var unique = [];
  var seen = {};
  var stopToUnique = [];
  located.forEach(function(r){
    var nm = r.city || '';
    var key = nm || (r.lng + ',' + r.lat);
    if(seen[key] == null){
      seen[key] = unique.length;
      var p = proj([r.lng, r.lat]);
      unique.push({city: nm, p: p, idx: unique.length});
    }
    stopToUnique.push(seen[key]);
  });

  // draw line progressively
  ctx.strokeStyle = '#C9A27A';
  ctx.lineWidth = 1.4 * px;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  var drawn = totalLen * progress;
  var acc = 0;
  for(var si=0;si<segments.length;si++){
    var seg = segments[si];
    if(acc >= drawn) break;
    var segRemain = drawn - acc;
    if(segRemain >= seg.len){
      for(var pi=0;pi<seg.pts.length;pi++){
        if(pi===0 && si>0) continue;
        if(pi===0 && si===0) ctx.moveTo(seg.pts[pi][0], seg.pts[pi][1]);
        else ctx.lineTo(seg.pts[pi][0], seg.pts[pi][1]);
      }
    } else {
      var partial = seg.len > 0 ? segRemain / seg.len : 1;
      if(partial > 0){
        var count = Math.max(1, Math.floor((seg.pts.length-1) * partial) + 1);
        for(var pi2=0;pi2<count;pi2++){
          if(pi2===0 && si>0) continue;
          if(pi2===0 && si===0) ctx.moveTo(seg.pts[pi2][0], seg.pts[pi2][1]);
          else ctx.lineTo(seg.pts[pi2][0], seg.pts[pi2][1]);
        }
      }
    }
    acc += seg.len;
  }
  ctx.stroke();

  // determine lit unique cities
  var litCount = litCities == null ? -1 : litCities;
  var litUnique = {};
  located.forEach(function(r, i){
    var shown = i <= litCount;
    if(shown){ litUnique[stopToUnique[i]] = true; }
  });

  var showLabels = (ctx.canvas && (ctx.canvas.clientWidth || 120)) >= 100;
  var fontSize = 11 * px;

  // Draw dots for each lit unique city
  unique.forEach(function(u){
    if(!u.p) return;
    if(!litUnique[u.idx]) return;
    ctx.fillStyle = '#C9A27A';
    ctx.beginPath();
    ctx.arc(u.p[0], u.p[1], 3*px, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(201,162,122,.5)';
    ctx.lineWidth = px;
    ctx.beginPath();
    ctx.arc(u.p[0], u.p[1], 6*px, 0, Math.PI*2);
    ctx.stroke();
  });

  if(!showLabels) return;

  // measure widths & build items for placeLabels
  ctx.font = '500 ' + fontSize + 'px "TravelSerif","Noto Serif SC",serif';
  var labelH = 11 * px;
  var items = [];
  var dotList = [];
  unique.forEach(function(u){
    if(!u.p) return;
    var w = ctx.measureText(u.city || '').width;
    var item = {x: u.p[0], y: u.p[1], w: w, h: labelH, r: 3*px, pref: (u.idx % 2 === 0) ? 'right' : 'left'};
    items.push(item);
    dotList.push({x: u.p[0], y: u.p[1], r: 3*px, _ref: item, _u: u});
  });

  // bounds: disc bounding square inset 6px
  var R = (globe.S/2 + globe.R) ? (globe.S/2 + globe.R) : (ctx.canvas.width/2);
  // use projection distance center: find projection of centroid? Simpler: bounds of canvas disc
  // The globe draws in canvas with center C and radius R.
  var cx = (globe.cx != null) ? globe.cx : ctx.canvas.width/2;
  var cy = (globe.cy != null) ? globe.cy : ctx.canvas.height/2;
  var discR = (globe.curR != null) ? globe.curR : Math.min(ctx.canvas.width, ctx.canvas.height)/2 - 4*px;
  var bounds = {x0: cx - discR, y0: cy - discR, x1: cx + discR, y1: cy + discR};

  var obstacles = {segments: routeSegs, dots: dotList, boxes: []};
  var placed = placeLabels(items, obstacles, bounds);

  // only draw labels for lit unique cities; map items back to unique
  ctx.textBaseline = 'middle';
  ctx.font = '500 ' + fontSize + 'px "TravelSerif","Noto Serif SC",serif';
  items.forEach(function(item, i){
    // find unique ref
    var u = dotList[i]._u;
    if(!litUnique[u.idx]) return;
    var pl = placed[i];
    if(!pl || pl.conflict) return; // tiny globe: drop a label rather than overlap
    if(pl.leader){
      ctx.save();
      ctx.strokeStyle = 'rgba(237,230,218,.35)';
      ctx.lineWidth = 1 * px;
      ctx.beginPath();
      var ex, ey;
      if(pl.anchor === 'start'){ ex = pl.box.x0; ey = (pl.box.y0 + pl.box.y1)/2; }
      else if(pl.anchor === 'end'){ ex = pl.box.x1; ey = (pl.box.y0 + pl.box.y1)/2; }
      else { ex = (pl.box.x0 + pl.box.x1)/2; ey = (pl.box.y0 < item.y) ? pl.box.y1 : pl.box.y0; }
      ctx.moveTo(item.x, item.y);
      ctx.lineTo(ex, ey);
      ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = '#EDE6DA';
    ctx.shadowColor = 'rgba(18,16,14,.9)';
    ctx.shadowBlur = 6;
    ctx.textAlign = pl.anchor === 'start' ? 'left' : (pl.anchor === 'end' ? 'right' : 'center');
    ctx.fillText(u.city || '', pl.x, pl.y);
    ctx.shadowBlur = 0;
  });
}

function rotateTo(countryName, dur){
  if(!globe.initialized) return;
  if(globe.tween){ cancelAnimationFrame(globe.raf); globe.tween = null; }
  if(globe.hoverActive) return;
  var feats = STATE.worldGeo.features;
  var target = feats.find(function(f){ return f.properties.name === countryName; });
  var toCenter = target ? d3.geoCentroid(target) : [WORLD_FALLBACK.lng, WORLD_FALLBACK.lat];
  toCenter = [-toCenter[0], -toCenter[1] * 0.6];
  var from = globe.proj.rotate().slice();
  var interpolate = d3.interpolate(from, toCenter);
  var t0 = performance.now();
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ globe.proj.rotate(toCenter); drawGlobe(countryName); window.__settled = true; return; }
  window.__settled = false;
  globe.tween = true;
  function frame(now){
    var p = Math.min(1, (now - t0) / (dur || 800));
    var e = d3.easeCubicInOut(p);
    if(globe.hoverActive){ globe.tween = null; return; }
    globe.proj.rotate(interpolate(e));
    drawGlobe(countryName, {keepRotate:true});
    if(p < 1){ globe.raf = requestAnimationFrame(frame); }
    else { globe.tween = null; window.__settled = true; }
  }
  globe.raf = requestAnimationFrame(frame);
}

function setGlobeActive(country, index, N){
  if(!globe.initialized) return;
  if(globe.hoverActive){ globe.cur = country; globe.pendingLbl = [country, index, N]; return; }
  var gc = document.getElementById('miniC');
  var gn = document.getElementById('miniN');
  if(gc) { gc.style.opacity = '0'; }
  setTimeout(function(){
    if(gc) gc.textContent = country;
    if(gn){
      if(index != null && N != null) gn.textContent = pad(index) + ' / ' + N;
      else gn.textContent = '常去';
    }
    if(gc) gc.style.opacity = '1';
  }, 200);
  if(country !== globe.cur){
    globe.cur = country;
    rotateTo(country, 800);
  } else {
    drawGlobe(country);
    window.__settled = true;
  }
}

// ---------- hover on trip articles ----------
var hoverTimer = null;
var hoverLeaveTimer = null;
var currentHovered = null;

function setupTripHover(){
  if(window.matchMedia('(max-width:640px)').matches) return;
  var mini = document.getElementById('mini');
  var items = document.querySelectorAll('.trip, .bleed, .arch-item');
  items.forEach(function(el){
    el.addEventListener('mouseenter', function(){
      var tid = el.getAttribute('data-trip-id');
      if(!tid) return;
      var story = STATE.story[tid];
      if(!story || !story.route) return;
      var located = story.route.filter(function(r){return r.lat!=null && r.lng!=null;});
      if(!located.length) return;
      if(hoverLeaveTimer) clearTimeout(hoverLeaveTimer);
      if(hoverTimer) clearTimeout(hoverTimer);
      hoverTimer = setTimeout(function(){ startHoverRoute(tid, story, mini); }, 120);
    });
    el.addEventListener('mouseleave', function(){
      if(hoverTimer){ clearTimeout(hoverTimer); hoverTimer = null; }
      if(hoverLeaveTimer) clearTimeout(hoverLeaveTimer);
      hoverLeaveTimer = setTimeout(function(){ endHoverRoute(mini); }, 80);
    });
  });
}

function startHoverRoute(tid, story, mini){
  if(!globe.initialized) return;
  var located = story.route.filter(function(r){return r.lat!=null && r.lng!=null;});
  if(!located.length) return;

  // trip countries
  var trip = STATE.trips.find(function(t){return t.id===tid;});
  var tripCountries = {};
  if(trip && trip.countries) trip.countries.forEach(function(c){ tripCountries[globeCountry(c)] = 1; });

  // centroid & bbox
  var lngs = located.map(function(r){return r.lng;});
  var lats = located.map(function(r){return r.lat;});
  var minLng = Math.min.apply(null,lngs), maxLng = Math.max.apply(null,lngs);
  var minLat = Math.min.apply(null,lats), maxLat = Math.max.apply(null,lats);
  var centroid = [(minLng+maxLng)/2, (minLat+maxLat)/2];

  // zoom
  var zoom = 5;
  if(located.length >= 2){
    var dLng = maxLng-minLng, dLat = maxLat-minLat;
    var spanDeg = Math.max(dLng, dLat);
    if(spanDeg > 0.001){
      var targetVisible = spanDeg / 0.42;
      zoom = Math.max(1, Math.min(9, 180 / targetVisible));
    }
  }

  // --- Size selection: largest S in [120..220] step 10 that doesn't intersect visible content ---
  var viewportW = window.innerWidth, viewportH = window.innerHeight;
  var labelH = 44; // approx label height
  var right = 32, bottom = 28;
  var sels = '#app figure, #app .txt, #app .t-title, #app .t-meta, #app .year .num, #app .turn h2, #app .img-wrap';
  var contentRects = [];
  try {
    var nodes = document.querySelectorAll(sels);
    for(var ni=0; ni<nodes.length; ni++){
      var r = nodes[ni].getBoundingClientRect();
      if(r.width <= 0 || r.height <= 0) continue;
      if(r.right < 0 || r.bottom < 0 || r.left > viewportW || r.top > viewportH) continue;
      contentRects.push(r);
    }
  } catch(e){}

  function overlapsAny(x0, y0, x1, y1){
    for(var i=0;i<contentRects.length;i++){
      var r = contentRects[i];
      if(!(x1 < r.left || x0 > r.right || y1 < r.top || y0 > r.bottom)) return true;
    }
    return false;
  }

  var chosenS = 120;
  for(var S=220; S>=120; S-=10){
    var bx1 = viewportW - right;
    var bx0 = bx1 - Math.max(S, 160);
    var by1 = viewportH - bottom;
    // box includes globe + label height below? label is BELOW globe in flex column
    var by0 = by1 - S - labelH;
    if(!overlapsAny(bx0, by0, bx1, by1)){ chosenS = S; break; }
  }
  // If none fit, choose smallest available tile (120) still
  mini.style.setProperty('--gs', chosenS + 'px');
  if(chosenS > 120){ mini.classList.add('grow'); }
  else { mini.classList.remove('grow'); }

  // update label
  var c = document.getElementById('miniC');
  var n = document.getElementById('miniN');
  if(c) c.textContent = trip ? trip.title : '';
  if(n) n.textContent = new Set(located.map(function(r){return r.city;})).size + ' 座城市';

  // store hover state
  globe.hoverRoute = located;
  globe.hoverTripCountries = tripCountries;
  globe.hoverCentroid = centroid;
  globe.hoverZoom = zoom;
  globe.hoverProgress = 0;
  globe.hoverLit = 0;
  globe.hoverActive = true;

  // animate
  animateHover();
}

function animateHover(){
  if(!globe.hoverActive) return;
  if(globe.hoverTween) cancelAnimationFrame(globe.hoverTween);
  if(globe.tween){ cancelAnimationFrame(globe.raf); globe.tween = null; }
  var n = (globe.hoverRoute||[]).length;
  var c = globe.hoverCentroid;
  var rotTo = [-c[0], -c[1]];
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){
    globe.proj.rotate(rotTo); globe.hoverZoomNow = globe.hoverZoom;
    globe.hoverProgress = 1; globe.hoverLit = n; drawHoverFrame(); window.__settled = true; return;
  }
  window.__settled = false;
  var rotFrom = globe.proj.rotate().slice();
  var rotI = d3.interpolate(rotFrom, rotTo);
  var zFrom = globe.hoverZoomNow || 1, zTo = globe.hoverZoom;
  var t0 = performance.now(), MOVE = 650, DRAW = 1200, START = 450;
  function frame(now){
    var t = now - t0;
    var pm = Math.min(1, t / MOVE), em = d3.easeCubicInOut(pm);
    globe.proj.rotate(rotI(em));
    globe.hoverZoomNow = zFrom * Math.pow(zTo / zFrom, em);
    var pd = Math.max(0, Math.min(1, (t - START) / DRAW));
    globe.hoverProgress = d3.easeSinInOut(pd);
    n = globe.hoverRoute.length;
    globe.hoverLit = t < START ? -1 : (n <= 1 ? 0 : Math.floor(globe.hoverProgress * (n - 1) + 0.001));
    drawHoverFrame();
    if(t < START + DRAW){ globe.hoverTween = requestAnimationFrame(frame); }
    else { globe.hoverTween = null; globe.hoverLit = n; drawHoverFrame(); window.__settled = true; }
  }
  globe.hoverTween = requestAnimationFrame(frame);
}

function drawHoverFrame(){
  if(!globe.hoverRoute) return;
  drawGlobe('', {
    zoom: globe.hoverZoomNow || globe.hoverZoom,
    route: globe.hoverRoute,
    routeProgress: globe.hoverProgress,
    litCities: globe.hoverLit,
    tripCountries: globe.hoverTripCountries,
    centroid: globe.hoverCentroid,
    keepRotate: true
  });
}

function endHoverRoute(mini){
  if(mini){
    mini.classList.remove('grow');
    mini.style.removeProperty('--gs');
  }
  globe.hoverActive = false;
  if(globe.hoverTween){ cancelAnimationFrame(globe.hoverTween); globe.hoverTween = null; }
  // revert label
  var c = document.getElementById('miniC');
  if(c) c.textContent = globe.cur;
  var pl = globe.pendingLbl; globe.pendingLbl = null;
  var nEl = document.getElementById('miniN');
  if(nEl){ var ci = pl && pl[0] === globe.cur ? pl : [globe.cur, findTripIndexByCountry(globe.cur) + 1, STATE.tripSeq.length]; nEl.textContent = ci[1] ? pad(ci[1]) + ' / ' + ci[2] : '常去'; }
  // fade zoom back
  var startZoom = globe.hoverZoomNow || globe.hoverZoom || 1;
  globe.hoverZoomNow = 1;
  var startProgress = globe.hoverProgress || 0;
  var hoverRoute = globe.hoverRoute;
  var t0 = performance.now();
  var dur = 520;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){
    globe.hoverRoute = null;
    drawGlobe(globe.cur);
    window.__settled = true;
    return;
  }
  window.__settled = false;
  var rotFrom = globe.proj.rotate().slice();
  var target = STATE.worldGeo.features.find(function(f){ return f.properties.name === globe.cur; });
  var ctr = target ? d3.geoCentroid(target) : [WORLD_FALLBACK.lng, WORLD_FALLBACK.lat];
  var rotTo = [-ctr[0], -ctr[1] * 0.6];
  var rotInterp = d3.interpolate(rotFrom, rotTo);
  function frame(now){
    var p = Math.min(1, (now-t0)/dur);
    var e = d3.easeCubicOut(p);
    var z = startZoom + (1 - startZoom) * e;
    var pr = startProgress * (1 - e);
    globe.proj.rotate(rotInterp(e));
    if(z > 1.001 && hoverRoute){
      drawGlobe('', {
        zoom: z,
        route: hoverRoute,
        routeProgress: pr,
        litCities: globe.hoverLit,
        tripCountries: globe.hoverTripCountries,
        centroid: ctr,
        keepRotate: true
      });
    } else {
      globe.hoverRoute = null;
      drawGlobe(globe.cur);
    }
    if(p < 1){
      globe.hoverTween = requestAnimationFrame(frame);
    } else {
      globe.hoverTween = null;
      globe.hoverRoute = null;
      drawGlobe(globe.cur);
      window.__settled = true;
    }
  }
  globe.hoverTween = requestAnimationFrame(frame);
}

// ---------- mobile route trigger ----------
var mobileRouteTimer = null;
var mobileActiveTrip = null;
function checkMobileRoute(){
  if(!window.matchMedia('(max-width:640px)').matches) return;
  if(parseHash().view !== 'world') return;
  var articles = document.querySelectorAll('.trip[data-trip-id], .bleed[data-trip-id]');
  var vh = window.innerHeight;
  var mid = vh/2;
  var found = null;
  for(var i=0;i<articles.length;i++){
    var r = articles[i].getBoundingClientRect();
    if(r.top < mid && r.bottom > mid){ found = articles[i]; break; }
  }
  if(!found){
    if(mobileRouteTimer){ clearTimeout(mobileRouteTimer); mobileRouteTimer = null; }
    if(mobileActiveTrip){ endMobileRoute(); }
    return;
  }
  var tid = found.getAttribute('data-trip-id');
  if(mobileActiveTrip === tid) return;
  if(mobileRouteTimer) clearTimeout(mobileRouteTimer);
  mobileRouteTimer = setTimeout(function(){
    var story = STATE.story[tid];
    if(!story) return;
    var trip = STATE.trips.find(function(t){return t.id===tid;});
    if(!trip) return;
    // play route draw at small size
    var located = story.route.filter(function(r){return r.lat!=null && r.lng!=null;});
    if(!located.length) return;
    
    var tripCountries = {};
    (trip.countries||[]).forEach(function(c){ tripCountries[globeCountry(c)] = 1; });
    
    var lngs = located.map(function(r){return r.lng;});
    var lats = located.map(function(r){return r.lat;});
    var centroid = [(Math.min.apply(null,lngs)+Math.max.apply(null,lngs))/2, (Math.min.apply(null,lats)+Math.max.apply(null,lats))/2];
    
    globe.hoverRoute = located;
    globe.hoverTripCountries = tripCountries;
    globe.hoverCentroid = centroid;
    globe.hoverZoom = 5;
    globe.hoverProgress = 0;
    globe.hoverLit = 0;
    globe.hoverActive = true;
    mobileActiveTrip = tid;
    animateHover();
  }, 700);
}

function endMobileRoute(){
  mobileActiveTrip = null;
  if(globe.hoverRoute){
    globe.hoverActive = false;
    if(globe.hoverTween){ cancelAnimationFrame(globe.hoverTween); globe.hoverTween = null; }
    globe.hoverRoute = null;
    drawGlobe(globe.cur);
  }
}

// ---------- observer ----------
var globeObserver = null;
function setupGlobeObserver(){
  if(globeObserver) globeObserver.disconnect();
  globeObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){
        if(globe.hoverActive) return;
        var c = e.target.getAttribute('data-c');
        if(!c) return;
        var i = e.target.getAttribute('data-i');
        var N = STATE.tripSeq.length;
        setGlobeActive(c, i ? parseInt(i,10) : null, i ? N : null);
      }
    });
  }, {rootMargin:'-45% 0px -45% 0px'});
  document.querySelectorAll('[data-c]').forEach(function(el){ globeObserver.observe(el); });
}

// ---------- LIGHTBOX ----------
var lb = {
  el:null, img:null, cap:null, list:[], idx:0, title:'', isOpen:false,
  touchStartX: 0, touchStartY: 0
};

function initLightbox(){
  lb.el = document.getElementById('lb');
  lb.img = document.getElementById('lbImg');
  lb.cap = document.getElementById('lbCap');

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', function(e){ e.stopPropagation(); prevPhoto(); });
  document.getElementById('lbNext').addEventListener('click', function(e){ e.stopPropagation(); nextPhoto(); });

  lb.el.addEventListener('click', function(e){
    if(e.target === lb.el) closeLightbox();
  });
  lb.img.addEventListener('click', function(e){
    var rect = lb.img.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var w = rect.width;
    if(x < w * 0.35) prevPhoto();
    else if(x > w * 0.65) nextPhoto();
  });

  document.addEventListener('keydown', function(e){
    if(!lb.isOpen) return;
    if(e.key === 'Escape'){ closeLightbox(); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); prevPhoto(); }
    else if(e.key === 'ArrowRight'){ e.preventDefault(); nextPhoto(); }
  });

  lb.el.addEventListener('touchstart', function(e){
    if(e.touches.length === 1){
      lb.touchStartX = e.touches[0].clientX;
      lb.touchStartY = e.touches[0].clientY;
    }
  }, {passive:true});
  lb.el.addEventListener('touchend', function(e){
    if(e.changedTouches.length === 1){
      var dx = e.changedTouches[0].clientX - lb.touchStartX;
      var dy = e.changedTouches[0].clientY - lb.touchStartY;
      if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){
        if(dx > 0) prevPhoto(); else nextPhoto();
      }
    }
  }, {passive:true});
}

function openLightbox(list, index, title){
  if(!lb.el) initLightbox();
  lb.list = list || [];
  lb.idx = index || 0;
  lb.title = title || '';
  lb.isOpen = true;
  lb.el.classList.add('open');
  document.body.style.overflow = 'hidden';
  showPhoto(true);
  preloadNeighbors();
}

function closeLightbox(){
  lb.isOpen = false;
  lb.el.classList.remove('open');
  document.body.style.overflow = '';
}

function showPhoto(instant){
  if(!lb.list.length) return;
  var item = lb.list[lb.idx];
  var src = item.src || item.full || '';
  lb.img.classList.remove('show');
  var newImg = new Image();
  newImg.onload = function(){ setImgContent(src); };
  newImg.onerror = function(){ setImgContent(src); };
  newImg.src = src;
  function setImgContent(u){
    lb.img.src = u;
    if(instant){ lb.img.classList.add('show'); }
    else { requestAnimationFrame(function(){ lb.img.classList.add('show'); }); }
  }
  lb.cap.textContent = lb.title + ' · ' + (lb.idx + 1) + ' / ' + lb.list.length;
  preloadNeighbors();
}

function preloadNeighbors(){
  if(lb.list.length < 2) return;
  var neighbors = [(lb.idx+1) % lb.list.length, (lb.idx-1+lb.list.length) % lb.list.length];
  neighbors.forEach(function(i){
    var it = lb.list[i];
    if(it){ var im = new Image(); im.src = it.src || it.full || ''; }
  });
}

function nextPhoto(){
  if(!lb.list.length) return;
  lb.idx = (lb.idx + 1) % lb.list.length;
  showPhoto(false);
}
function prevPhoto(){
  if(!lb.list.length) return;
  lb.idx = (lb.idx - 1 + lb.list.length) % lb.list.length;
  showPhoto(false);
}
window.__openLightbox = openLightbox;

// ---------- MUSIC ----------
var music = {
  audio: null,
  on: false,
  src: null,
  found: false,
  fadeRaf: null,
  visible: true
};

function initMusic(){
  window.__music = music;
  var toggles = [document.getElementById('musicToggle'), document.getElementById('musicToggleDetail')];
  // restore from session
  var sess = null;
  try { sess = sessionStorage.getItem('musicOn'); } catch(e){}
  // default muted on every visit; never resume without a click
  
  toggles.forEach(function(btn){
    if(!btn) return;
    btn.addEventListener('click', function(){
      if(!music.found) return;
      if(music.on) turnMusicOff(true);
      else turnMusicOn(true);
    });
  });
  
  // discovery
  discoverAudio().then(function(src){
    if(!src) return;
    music.src = src;
    music.found = true;
    toggles.forEach(function(b){ if(b) b.classList.add('visible'); });
    if(music.on){
      // resume
      ensureAudio();
      if(music.audio){
        try { music.audio.play().catch(function(){}); } catch(e){}
        fadeVolume(music.audio.volume, getTargetVol(), 400);
        updateBars(true);
      }
    }
  });
  
  // visibility
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){
      if(music.audio && music.on){
        fadeVolume(music.audio.volume, 0, 300, function(){
          if(music.audio) music.audio.pause();
        });
      }
    } else {
      if(music.audio && music.on){
        try { music.audio.play().catch(function(){}); } catch(e){}
        fadeVolume(music.audio.volume, getTargetVol(), 400);
        updateBars(true);
      }
    }
  });
  window.addEventListener('pagehide', function(){
    if(music.audio && music.on){
      try { music.audio.pause(); } catch(e){}
    }
  });
}

function syncMusicVolume(){
  if(music.audio && music.on && !document.hidden) fadeVolume(music.audio.volume, getTargetVol(), 800);
}
function getTargetVol(){
  return document.body.classList.contains('detail') ? 0.16 : 0.25;
}

function discoverAudio(){
  function tryEndpoints(){
    // 1. manifest
    return fetch('public/audio/manifest.json').then(function(r){
      if(!r.ok) throw new Error('no manifest');
      return r.json();
    }).then(function(j){
      if(!j) throw new Error('empty');
      if(j.src) return resolveSrc(j.src);
      if(j.tracks && j.tracks.length && j.tracks[0].src) return resolveSrc(j.tracks[0].src);
      if(Array.isArray(j) && j.length) return resolveSrc(j[0]);
      throw new Error('bad manifest');
    }).catch(function(){
      // 2. directory listing
      return fetch('public/audio/').then(function(r){
        if(!r.ok) throw new Error('no dir');
        return r.text();
      }).then(function(txt){
        var re = /href=["']([^"']+\.(?:mp3|m4a|ogg|opus|webm))["']/gi;
        var m, found = null;
        while((m = re.exec(txt)) !== null){
          if(!found) found = m[1];
        }
        if(found) return resolveSrc(found);
        throw new Error('no audio in listing');
      }).catch(function(){
        // 3. HEAD probes
        var candidates = ['public/audio/bgm.mp3','public/audio/music.mp3','public/audio/track.mp3','public/audio/bgm.ogg'];
        var i = 0;
        function next(){
          if(i >= candidates.length) return Promise.resolve(null);
          var c = candidates[i++];
          return fetch(c, {method:'HEAD'}).then(function(r){
            if(r.ok) return c;
            return next();
          }).catch(function(){ return next(); });
        }
        return next();
      });
    });
  }
  function resolveSrc(s){
    if(/^https?:|^\/|^public\//.test(s)) return s;
    // relative to public/audio/
    return 'public/audio/' + s.replace(/^\.\//,'');
  }
  return tryEndpoints();
}

function ensureAudio(){
  if(music.audio) return;
  try {
    music.audio = new Audio(music.src);
    music.audio.loop = true;
    music.audio.preload = 'none';
    music.audio.volume = 0;
  } catch(e){ music.audio = null; }
}

function fadeVolume(from, to, dur, cb){
  if(!music.audio) return;
  if(music.fadeRaf){ cancelAnimationFrame(music.fadeRaf); music.fadeRaf = null; }
  var t0 = performance.now();
  function step(now){
    var p = Math.min(1, (now-t0)/dur);
    music.audio.volume = Math.max(0, Math.min(1, from + (to-from)*p));
    if(p < 1){
      music.fadeRaf = requestAnimationFrame(step);
    } else {
      music.fadeRaf = null;
      if(cb) cb();
    }
  }
  music.fadeRaf = requestAnimationFrame(step);
}

function turnMusicOn(persist){
  ensureAudio();
  if(!music.audio) return;
  music.on = true;
  try { music.audio.play().catch(function(){ music.on = false; updateBars(false); }); } catch(e){}
  music.audio.volume = 0;
  fadeVolume(0, getTargetVol(), 2000);
  updateBars(true);
  if(persist){ try { sessionStorage.setItem('musicOn','1'); } catch(e){} }
}

function turnMusicOff(persist){
  music.on = false;
  if(music.audio){
    fadeVolume(music.audio.volume, 0, 600, function(){
      if(music.audio) try { music.audio.pause(); } catch(e){}
    });
  }
  updateBars(false);
  if(persist){ try { sessionStorage.removeItem('musicOn'); } catch(e){} }
}

function updateBars(playing){
  var toggles = [document.getElementById('musicToggle'), document.getElementById('musicToggleDetail')];
  toggles.forEach(function(b){
    if(!b) return;
    b.classList.toggle('playing', playing);
    b.setAttribute('aria-pressed', playing ? 'true' : 'false');
  });
}

// ---------- init on ready ----------
document.addEventListener('DOMContentLoaded', function(){
  initLightbox();
  initMusic();
});
if(document.readyState !== 'loading'){
  initLightbox();
  initMusic();
}

window.__settled = true;
window.__ready = false;

})();
</script>
