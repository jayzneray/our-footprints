<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我们的足迹</title>
<meta name="description" content="嘉怡和政兴的旅行记录：走过的城市、路线和那些天的小事。">
<meta name="theme-color" content="#12100E">
<meta property="og:title" content="我们的足迹">
<meta property="og:description" content="一开始是嘉怡一个人的路，后来变成了两个人的。">
<meta property="og:image" content="public/og-cover.jpg">
<link rel="icon" href="public/favicon.svg" type="image/svg+xml">
<link rel="icon" href="public/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="public/apple-touch-icon.png">
<link rel="preload" href="public/photos/morocco/03.webp" as="image">
<link rel="preload" href="public/v9/fonts/serif-sc.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'FSerif';src:url('public/v9/fonts/serif-sc.woff2') format('woff2');font-weight:400 600;font-display:swap}
@font-face{font-family:'FLatin';src:url('public/v9/fonts/cormorant.woff2') format('woff2');font-weight:300 700;font-display:swap}
@font-face{font-family:'FLatin';src:url('public/v9/fonts/cormorant-italic.woff2') format('woff2');font-weight:300 700;font-style:italic;font-display:swap}
:root{
  --bg:#12100E;--bg2:#171411;--bg3:#1D1915;--ink:#EDE6DA;--ink2:rgba(237,230,218,.78);--muted:#8C8378;--dim:rgba(237,230,218,.42);
  --line:rgba(237,230,218,.10);--line2:rgba(237,230,218,.18);--acc:#C9A27A;--acc2:rgba(201,162,122,.55);--solo:#9A9084;
  --serif:'FSerif','Noto Serif CJK SC','Noto Serif SC','Source Han Serif SC','Songti SC','STSong',serif;
  --latin:'FLatin','Cormorant Garamond','Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);--ease2:cubic-bezier(.65,0,.35,1);
  --pad:clamp(20px,5.5vw,88px);--max:1320px;
}
*{box-sizing:border-box}
html{scroll-behavior:auto;-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block}
::selection{background:rgba(201,162,122,.35)}
.latin{font-family:var(--latin)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.progress{position:fixed;left:0;top:0;height:1px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:var(--acc);z-index:60;opacity:.8;pointer-events:none}
.top{position:fixed;left:0;right:0;top:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad);z-index:50;transition:background .5s var(--ease),backdrop-filter .5s,border-color .5s;border-bottom:1px solid transparent}
.top.solid{background:rgba(18,16,14,.78);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border-bottom-color:var(--line)}
.top .mark{font-family:var(--serif);font-size:15px;letter-spacing:.32em;color:var(--ink);display:flex;align-items:center;gap:12px;white-space:nowrap}
.top .mark i{font-style:italic;font-family:var(--latin);font-size:15px;letter-spacing:.1em;color:rgba(237,230,218,.55)}
.nav{display:flex;align-items:center;gap:30px}
.nav a,.nav button.lnk{font-size:12px;letter-spacing:.24em;color:var(--ink2);position:relative;padding:6px 0;transition:color .3s}
.nav a:hover,.nav button.lnk:hover{color:var(--ink)}
.nav a::after{content:'';position:absolute;left:0;right:.24em;bottom:0;height:1px;background:var(--acc);transform:scaleX(0);transform-origin:0 50%;transition:transform .5s var(--ease)}
.nav a:hover::after,.nav a.on::after{transform:scaleX(1)}
.d-nav{display:none;align-items:center;gap:26px}
.d-nav a{font-size:12px;letter-spacing:.16em;color:var(--ink2);transition:color .3s;white-space:nowrap}
.d-nav a:hover{color:var(--ink)}
.d-title{position:absolute;left:50%;transform:translate(-50%,6px);font-family:var(--serif);font-size:14px;letter-spacing:.2em;color:var(--ink2);opacity:0;transition:opacity .5s,transform .5s var(--ease);pointer-events:none;white-space:nowrap}
.top.show-title .d-title{opacity:1;transform:translate(-50%,0)}
body.is-detail .nav{display:none}
body.is-detail .d-nav{display:flex}
.back{font-size:12px;letter-spacing:.2em;color:var(--ink2);display:none;align-items:center;gap:10px}
body.is-detail .back{display:flex}
body.is-detail .top .mark{display:none}
.back:hover{color:var(--ink)}

/* music toggle */
.music{position:relative;width:34px;height:34px;display:flex;align-items:center;justify-content:center;margin-left:6px}
.music .bars{display:flex;align-items:flex-end;gap:2px;height:14px}
.music .bars span{width:1.5px;height:3px;background:rgba(237,230,218,.7);border-radius:1px;transition:height .5s var(--ease),background .4s}
.music.on .bars span{animation:eq 1.6s var(--ease2) infinite alternate;background:var(--acc)}
.music.on .bars span:nth-child(2){animation-duration:1.15s;animation-delay:-.4s}
.music.on .bars span:nth-child(3){animation-duration:1.9s;animation-delay:-.9s}
.music.on .bars span:nth-child(4){animation-duration:1.35s;animation-delay:-.2s}
@keyframes eq{0%{height:3px}50%{height:11px}100%{height:6px}}
.music .tip{position:absolute;right:0;top:calc(100% + 10px);padding:9px 14px;background:rgba(18,16,14,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);font-size:11px;letter-spacing:.16em;color:var(--ink2);opacity:0;transform:translateY(-4px);transition:opacity .35s,transform .45s var(--ease);pointer-events:none;white-space:nowrap}
.music:hover .tip,.music:focus-visible .tip,.music.flash .tip{opacity:1;transform:none}
.music .tip em{font-style:italic;font-family:var(--latin);font-size:13px;letter-spacing:.04em;color:var(--muted);margin-left:8px}

/* ---------- view transitions ---------- */
#view{transition:opacity .45s var(--ease),transform .6s var(--ease)}
#view.out{opacity:0;transform:translateY(10px)}
.veil{position:fixed;inset:0;background:var(--bg);z-index:80;pointer-events:none;opacity:1;transition:opacity 1.1s var(--ease)}
.veil.gone{opacity:0}

/* ---------- images ---------- */
.ph{position:relative;overflow:hidden;background:var(--bg3);background-size:cover;background-position:center}
.ph img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s var(--ease),transform 1.6s var(--ease)}
.ph img.ld{opacity:1}
.ph.lift{cursor:zoom-in}
.ph.lift::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,236,212,.10),transparent 60%);opacity:0;transition:opacity .6s}
.ph.lift:hover::after{opacity:1}
.ph.lift:hover img.ld{transform:scale(1.025)}
.blurbg{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(18px);transform:scale(1.05);opacity:.9}

/* reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity 1.1s var(--ease),transform 1.2s var(--ease)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}.rv.d3{transition-delay:.24s}.rv.d4{transition-delay:.32s}

/* ---------- hero ---------- */
.hero{position:relative;height:100vh;height:100svh;min-height:560px;overflow:hidden;background:#0d0b0a}
.hero .kb{position:absolute;inset:0;transform-origin:58% 62%;animation:kb 26s var(--ease) forwards}
.hero .kb .ph{position:absolute;inset:0;background-color:#0d0b0a}
.hero .kb img{object-position:50% 58%}
@keyframes kb{from{transform:scale(1.14) translate3d(0,1.5%,0)}to{transform:scale(1.0) translate3d(0,0,0)}}
.hero::before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(18,16,14,.42) 0%,rgba(18,16,14,0) 22%),linear-gradient(to top,rgba(18,16,14,.86) 0%,rgba(18,16,14,.35) 30%,rgba(18,16,14,0) 55%)}
.hero .cap{position:absolute;z-index:2;left:var(--pad);right:var(--pad);bottom:clamp(70px,13vh,130px)}
.hero .eyebrow{font-family:var(--latin);font-style:italic;font-size:19px;letter-spacing:.06em;color:rgba(241,235,224,.9);margin-bottom:22px;opacity:0;animation:fadeUp 1.4s var(--ease) 1.7s forwards}
.hero h1{margin:0;font-family:var(--serif);font-weight:500;font-size:clamp(44px,7.4vw,108px);line-height:1;letter-spacing:.16em;color:#F3EDE3;display:flex}
.hero h1 span{display:inline-block;opacity:0;transform:translateY(.4em);filter:blur(8px);animation:charIn 1.6s var(--ease) forwards}
@keyframes charIn{to{opacity:1;transform:none;filter:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hero .sub{margin-top:30px;max-width:520px;font-family:var(--serif);font-size:16px;line-height:2;letter-spacing:.12em;color:rgba(237,230,218,.86);opacity:0;animation:fadeUp 1.4s var(--ease) 2.1s forwards}
.hero .meta{position:absolute;z-index:2;right:var(--pad);bottom:clamp(70px,13vh,130px);text-align:right;font-size:11px;letter-spacing:.26em;color:rgba(237,230,218,.62);line-height:2.2;opacity:0;animation:fadeUp 1.4s var(--ease) 2.4s forwards}
.hero .meta b{font-family:var(--latin);font-weight:400;font-size:15px;letter-spacing:.14em;color:rgba(237,230,218,.84)}
.cue{position:absolute;z-index:2;left:50%;bottom:26px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;font-size:12px;letter-spacing:.42em;padding-left:.42em;color:rgba(237,230,218,.86);text-shadow:0 1px 10px rgba(0,0,0,.6);min-height:44px;min-width:44px;opacity:0;animation:fadeUp 1.2s var(--ease) 2.9s forwards}
.cue i{display:block;width:1px;height:44px;background:rgba(237,230,218,.3);position:relative;overflow:hidden}
.cue i::after{content:'';position:absolute;left:0;top:-40%;width:1px;height:40%;background:var(--ink);animation:cue 2.4s var(--ease2) infinite}
@keyframes cue{0%{top:-40%}100%{top:100%}}

/* ---------- intro & stats ---------- */
.sec{padding:0 var(--pad)}
.wrap{max-width:var(--max);margin:0 auto}
.intro{padding:clamp(100px,13vh,150px) 0 clamp(60px,8vh,90px);display:grid;grid-template-columns:repeat(12,1fr);gap:0 24px}
.intro .k{grid-column:1/4;font-size:11px;letter-spacing:.34em;color:var(--muted);padding-top:12px}
.intro .k .latin{display:block;font-style:italic;font-size:15px;letter-spacing:.06em;margin-top:10px;color:var(--dim)}
.intro .lede{grid-column:4/13;font-family:var(--serif);font-size:clamp(18px,1.72vw,25px);text-wrap:pretty;line-height:2;letter-spacing:.08em;color:rgba(237,230,218,.9);margin:0}
.intro .lede em{font-style:normal;color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:34px 0 30px;border-left:1px solid var(--line);padding-left:26px}
.stat:first-child{border-left:0;padding-left:0}
.stat .n{font-family:var(--latin);font-weight:300;font-size:clamp(46px,5.4vw,78px);line-height:1;letter-spacing:-.01em;color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.stat .l{margin-top:14px;font-size:12px;letter-spacing:.28em;color:var(--muted)}

/* ---------- overview scrolly map ---------- */
.ov{position:relative;margin-top:clamp(90px,14vh,150px)}
.ov-head{padding:0 var(--pad);margin-bottom:42px}
.ov-head .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:30px}
.sec-k{font-size:11px;letter-spacing:.34em;color:var(--muted)}
.sec-t{margin:14px 0 0;font-family:var(--serif);font-weight:500;font-size:clamp(28px,3vw,40px);letter-spacing:.12em;line-height:1.3}
.legend{display:flex;gap:28px;font-size:12px;letter-spacing:.18em;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:10px}
.legend i{display:block;width:28px;height:0;border-top:1px solid var(--solo)}
.legend i.tg{border-top:1.6px solid var(--acc)}
.ov-stage{position:relative}
.ov-sticky{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.ov-map{position:absolute;inset:0}
.ov-map svg{display:block;width:100%;height:100%}
.ov-sticky::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,rgba(18,16,14,.92) 0%,rgba(18,16,14,.55) 26%,rgba(18,16,14,0) 46%),linear-gradient(to bottom,var(--bg) 0%,rgba(18,16,14,0) 12%,rgba(18,16,14,0) 88%,var(--bg) 100%)}
.ov-year{position:absolute;z-index:2;right:var(--pad);bottom:6vh;font-family:var(--latin);font-weight:300;font-size:clamp(90px,13vw,190px);line-height:.8;color:rgba(237,230,218,.07);letter-spacing:-.02em;pointer-events:none;transition:opacity .6s}
.ov-steps{position:relative;z-index:3;margin-top:-100vh;margin-top:-100svh;pointer-events:none}
.ov-step{height:100vh;height:100svh;display:flex;align-items:center;padding:0 var(--pad)}
.ov-step:first-child{height:90vh}
.ov-card{pointer-events:auto;width:min(380px,86vw);padding:6px 0;opacity:.18;transition:opacity .8s var(--ease),transform .9s var(--ease);transform:translateY(18px)}
.ov-step.on .ov-card{opacity:1;transform:none}
.ov-card .y{font-family:var(--latin);font-size:20px;font-style:italic;color:var(--acc);letter-spacing:.06em}
.ov-card h3{margin:12px 0 16px;font-family:var(--serif);font-weight:500;font-size:clamp(22px,2.2vw,30px);letter-spacing:.1em;line-height:1.45}
.ov-card p{margin:0;font-size:14px;line-height:2.05;letter-spacing:.06em;color:var(--ink2)}
.ov-card .trips{margin-top:20px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line)}
.ov-card .trips a{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;letter-spacing:.1em;color:var(--ink2);transition:color .3s,padding .4s var(--ease)}
.ov-card .trips a:hover{color:var(--ink);padding-left:6px}
.ov-card .trips a small{font-family:var(--latin);font-size:14px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}

/* map shared */
.mp-land{fill:#211D19;stroke:rgba(237,230,218,.09);stroke-width:.6;vector-effect:non-scaling-stroke}
.mp-land.v{fill:#30291F;stroke:rgba(237,230,218,.2)}
.mp-land.hl{fill:#3C3227;stroke:rgba(237,230,218,.24)}
.mp-sea{fill:#0E0C0B}
.mp-grat{fill:none;stroke:rgba(237,230,218,.035);stroke-width:.6;vector-effect:non-scaling-stroke}
.mp-coast{fill:none}
.mp-route{fill:none;stroke-linecap:round;stroke-linejoin:round}
.mp-route.solo{stroke:var(--solo);stroke-width:1.1;opacity:.85}
.mp-route.tg{stroke:var(--acc);stroke-width:1.6}
.mp-route.ghost{stroke:rgba(237,230,218,.16);stroke-width:1;stroke-dasharray:2 4}
.mp-dot{fill:var(--bg);stroke:var(--ink2);stroke-width:1.2}
.mp-dot.past{fill:var(--acc);stroke:var(--acc)}
.mp-dot.solo{fill:var(--solo);stroke:var(--solo)}
.mp-dot.tg{fill:var(--acc);stroke:var(--acc)}
.mp-dot.cur{fill:var(--acc);stroke:var(--acc)}
.mp-pulse{fill:none;stroke:var(--acc);stroke-width:1;transform-box:fill-box;transform-origin:center;animation:mpPulse 2.6s ease-out infinite}
@keyframes mpPulse{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.mp-ring{fill:none;stroke:var(--acc);stroke-width:1;transition:opacity .6s}
.mp-lbl{font-family:var(--serif);font-size:13px;letter-spacing:.08em;fill:rgba(237,230,218,.86);paint-order:stroke;stroke:rgba(18,16,14,.92);stroke-width:4px;stroke-linejoin:round;transition:opacity .4s}
.mp-lbl.cur{fill:#F3EDE3;font-size:15px}
.mp-lbl.dim{fill:rgba(237,230,218,.5)}
.mp-cdot{fill:rgba(237,230,218,.32)}
.mp-clbl{font-family:var(--serif);font-size:11px;letter-spacing:.06em;fill:rgba(237,230,218,.34);paint-order:stroke;stroke:rgba(18,16,14,.85);stroke-width:3px}
.mp-cty{font-family:var(--sans);font-size:10px;letter-spacing:.42em;fill:rgba(237,230,218,.26);text-anchor:middle;pointer-events:none}
.mp-sealbl{font-family:var(--latin);font-style:italic;font-size:14px;letter-spacing:.2em;fill:rgba(237,230,218,.16);text-anchor:middle;pointer-events:none}

/* ---------- year chapters ---------- */
.chap{padding:clamp(70px,9vh,100px) var(--pad) 0}
.chap-h{display:grid;grid-template-columns:repeat(12,1fr);gap:0 24px;align-items:end;margin-bottom:clamp(44px,6vh,70px)}
.chap-h .yr{grid-column:1/8;font-family:var(--latin);font-weight:300;font-size:clamp(120px,17vw,250px);line-height:.78;letter-spacing:-.03em;color:rgba(237,230,218,.9);margin:0}
.chap-h .yr span{display:inline-block}
.chap-h .txt{grid-column:8/13;padding-bottom:12px}
.chap-h .txt .c{font-size:11px;letter-spacing:.32em;color:var(--muted);margin-bottom:16px}
.chap-h .txt p{margin:0;font-family:var(--serif);font-size:17px;line-height:2;letter-spacing:.08em;color:var(--ink2)}

.trip{display:grid;grid-template-columns:repeat(12,1fr);gap:0 24px;align-items:end;margin-bottom:clamp(72px,10vh,112px);position:relative}
.trip .vis{position:relative}
.chap .trip:last-child{margin-bottom:0}
.trip .vis .ph{width:100%;height:100%}
.trip .vis .main{aspect-ratio:4/5}
.trip .info{position:relative;padding-bottom:6px}
.trip .no{font-family:var(--latin);font-size:15px;letter-spacing:.12em;color:var(--muted)}
.trip .no i{font-style:italic;color:var(--dim);margin-left:12px}
.trip h3{text-wrap:balance;margin:16px 0 18px;font-family:var(--serif);font-weight:500;font-size:clamp(28px,2.7vw,40px);line-height:1.3;letter-spacing:.08em}
.trip h3 a{background:linear-gradient(var(--acc),var(--acc)) 0 100%/0 1px no-repeat;transition:background-size .7s var(--ease),color .4s;padding-bottom:4px}
.trip:hover h3 a{background-size:100% 1px}
.trip .meta{font-size:12px;letter-spacing:.2em;color:var(--muted);line-height:2}
.trip .meta b{font-weight:400;color:var(--ink2)}
.trip .rt{margin:22px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 0;font-family:var(--serif);font-size:14px;letter-spacing:.1em;color:var(--ink2)}
.trip .rt .ar{display:inline-block;width:26px;height:1px;background:var(--line2);margin:0 10px;position:relative;top:-1px}
.trip .sum{margin:22px 0 0;font-family:var(--serif);font-size:16px;line-height:2;letter-spacing:.06em;color:var(--ink2);max-width:30em}
.trip .who{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.26em;color:var(--muted);margin-top:26px}
.trip .who i{display:block;width:16px;border-top:1px solid var(--solo)}
.trip .who.tg i{border-top:1.6px solid var(--acc)}
.trip .open{display:inline-flex;align-items:center;gap:12px;margin-top:30px;font-size:12px;letter-spacing:.26em;color:var(--ink);padding:10px 0;border-bottom:1px solid var(--line2);transition:gap .5s var(--ease),border-color .4s}
.trip .open:hover{gap:20px;border-color:var(--acc)}
.trip .open svg{width:18px;height:8px}
/* layout variants */
.trip.l-a .vis{grid-column:1/8}.trip.l-a .info{grid-column:9/13}
.trip.l-b .vis{grid-column:6/13;grid-row:1}.trip.l-b .info{grid-column:1/5;grid-row:1}
.trip.l-c .vis{grid-column:1/8;display:grid;grid-template-columns:5fr 2.3fr;gap:24px;align-items:end}.trip.l-c .info{grid-column:9/13}
.trip.l-c .vis .main{aspect-ratio:4/5}
.trip.l-c .vis .second,.trip.l-d .vis .second{aspect-ratio:3/4;margin-bottom:-9vh}
.trip.l-d .vis{grid-column:6/13;grid-row:1;display:grid;grid-template-columns:2.3fr 5fr;gap:24px;align-items:end}.trip.l-d .info{grid-column:1/5;grid-row:1}
.trip.l-d .vis .second{order:-1;margin-bottom:0;margin-top:0;align-self:start;transform:translateY(-8vh)}
.trip.l-d .vis .main{aspect-ratio:4/5}
.trip.l-a .vis .main{aspect-ratio:5/4}
.trip.l-b .vis .main{aspect-ratio:5/4}
.trip.l-a .vis .second,.trip.l-b .vis .second{display:none}
.trip.l-map .vis{grid-column:1/8}.trip.l-map .info{grid-column:9/13}
.trip.l-map{align-items:center}.trip.l-map .vis .main{aspect-ratio:5/4;max-height:78vh;background:var(--bg2);border:1px solid var(--line)}
.trip.l-map.flip .vis{grid-column:6/13;grid-row:1}.trip.l-map.flip .info{grid-column:1/5;grid-row:1}
.maparts{position:absolute;inset:0}
.trip .hls{margin:20px 0 0;display:flex;flex-wrap:wrap;gap:8px}.trip .hls span{font-size:12px;letter-spacing:.14em;color:var(--ink2);border:1px solid var(--line2);padding:6px 12px;border-radius:999px}
.maparts svg{width:100%;height:100%;display:block}
.maparts .tag{position:absolute;left:22px;bottom:18px;font-family:var(--latin);font-style:italic;font-size:15px;letter-spacing:.06em;color:var(--muted)}
/* route map inside info column */
.rmap{position:relative;margin-top:34px;width:100%;max-width:400px;aspect-ratio:16/11;background:#0E0C0B;border:1px solid var(--line);overflow:hidden}
.rmap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.rmap .rc{position:absolute;left:14px;top:11px;font-size:10px;letter-spacing:.28em;color:var(--muted);pointer-events:none;transition:opacity .5s}
.rmap .rk{position:absolute;right:14px;bottom:10px;font-family:var(--latin);font-size:14px;color:var(--muted);letter-spacing:.04em;pointer-events:none}
.trip.act .rmap{border-color:var(--line2)}
/* turn interlude */
.turn{position:relative;height:118vh;margin:clamp(40px,8vh,90px) 0 clamp(110px,15vh,170px)}
.turn .ph{position:sticky;top:0;height:100vh;height:100svh;width:100%}
.turn .ph img{object-position:50% 45%}
.turn .ph::before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(18,16,14,.88) 0%,rgba(18,16,14,.25) 50%,rgba(18,16,14,.3) 100%),linear-gradient(to right,rgba(18,16,14,.6) 0%,rgba(18,16,14,0) 55%)}
.turn .t{position:absolute;z-index:2;left:var(--pad);bottom:16vh;max-width:620px}
.turn .t .k{font-family:var(--latin);font-style:italic;font-size:19px;color:#E2C7A6;letter-spacing:.06em}
.turn .t h2{margin:18px 0 22px;font-family:var(--serif);font-weight:500;font-size:clamp(30px,3.6vw,52px);line-height:1.45;letter-spacing:.12em;color:#F3EDE3}
.turn .t p{margin:0;font-family:var(--serif);font-size:16px;line-height:2;letter-spacing:.08em;color:rgba(237,230,218,.84)}
.turn .lines{display:flex;gap:30px;margin-top:28px;font-size:12px;letter-spacing:.22em;color:rgba(237,230,218,.72)}
.turn .lines span{display:flex;align-items:center;gap:10px}
.turn .lines i{display:block;width:40px;border-top:1px solid var(--solo)}
.turn .lines i.tg{border-top:1.6px solid var(--acc)}

/* ---------- places that repeat ---------- */
.again{padding:clamp(90px,11vh,120px) var(--pad) 0}
.again-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:0 24px;margin-top:60px}
.ag{position:relative;display:block}
.ag .ph{aspect-ratio:3/4}
.ag .ph img{transition:opacity .9s var(--ease),transform 1.8s var(--ease)}
.ag:hover .ph img.ld{transform:scale(1.035)}
.ag h4{margin:22px 0 10px;font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:.1em}
.ag p{margin:0;font-size:13px;line-height:1.9;letter-spacing:.08em;color:var(--ink2)}
.ag .ticks{display:flex;gap:0;margin-top:16px;align-items:center}
.ag .ticks span{font-family:var(--latin);font-size:13px;color:var(--muted);letter-spacing:.04em;display:flex;align-items:center}
.ag .ticks span+span::before{content:'';width:22px;border-top:1px solid var(--line2);margin:0 8px}
.ag .ticks span.me{color:var(--acc)}
.ag.g1{grid-column:1/6}.ag.g2{grid-column:7/10;margin-top:18vh}.ag.g3{grid-column:10/13;margin-top:6vh}

/* ---------- country archive ---------- */
.arch{padding:clamp(90px,11vh,120px) var(--pad) 0}
.arch-list{margin-top:56px;border-top:1px solid var(--line)}
.arow{display:grid;grid-template-columns:minmax(150px,2fr) 1fr 8fr;gap:24px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line);transition:background .5s}
.arow:hover{background:rgba(237,230,218,.018)}
.arow .cn{font-family:var(--serif);font-size:20px;letter-spacing:.14em}
.arow .cn small{display:block;font-family:var(--latin);font-style:italic;font-size:14px;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.arow .ct{font-family:var(--latin);font-size:15px;color:var(--muted);letter-spacing:.04em}
.arow .th{display:flex;gap:10px;overflow:hidden;justify-content:flex-start}
.arow .th .ph{width:78px;height:104px;flex:0 0 auto;transition:transform .6s var(--ease),opacity .5s;opacity:.78}
.arow:hover .th .ph{opacity:1}
.arow .th .ph:hover{transform:translateY(-4px)}
.arow .rtx{align-items:center;gap:18px;min-height:104px;font-family:var(--serif);font-size:16px;letter-spacing:.12em;color:var(--ink2,#EDE6DA)}
.arow .rtx em{font-style:normal;font-family:var(--sans,inherit);font-size:12px;letter-spacing:.16em;color:var(--muted)}
.arow .rtx svg{width:18px;opacity:.6;transition:transform .5s var(--ease)}.arow .rtx:hover svg{transform:translateX(5px);opacity:1}

/* ---------- ending ---------- */
.ending{padding:clamp(110px,15vh,150px) var(--pad) 60px;text-align:center}
.ending .rule{width:1px;height:70px;background:linear-gradient(var(--acc),transparent);margin:0 auto 46px}
.ending h2{margin:0;font-family:var(--serif);font-weight:500;font-size:clamp(24px,2.6vw,34px);letter-spacing:.42em;padding-left:.42em}
.ending p{margin:22px 0 0;font-size:13px;letter-spacing:.2em;color:var(--muted);line-height:2}
.rand{margin-top:56px;display:inline-flex;align-items:center;gap:14px;padding:15px 26px;border:1px solid var(--line2);border-radius:999px;font-size:12px;letter-spacing:.26em;color:var(--ink);transition:border-color .4s,background .4s,gap .5s var(--ease)}
.rand:hover{border-color:var(--acc);background:rgba(201,162,122,.06);gap:18px}
.rand svg{width:15px;height:15px}
.foot>div:first-child{white-space:nowrap}
.foot{margin-top:clamp(80px,11vh,120px);padding-top:28px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:30px;font-size:11px;letter-spacing:.14em;color:var(--dim);line-height:2;text-align:left}
.foot a{border-bottom:1px solid var(--line2)}
.foot a:hover{color:var(--ink2)}

/* ---------- corner globe ---------- */
.globe{position:fixed;right:28px;bottom:26px;width:188px;z-index:40;pointer-events:none;opacity:0;transform:translateY(10px);transition:opacity .6s var(--ease),transform .7s var(--ease)}
.globe.vis{opacity:1;transform:none}
.globe canvas{width:188px;height:188px;display:block}
.globe .gc{margin-top:10px;text-align:center;font-family:var(--serif);font-size:13px;letter-spacing:.16em;color:var(--ink2);min-height:20px;transition:opacity .4s}
.globe .gc small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.28em;color:var(--muted);margin-top:4px}

/* ---------- detail ---------- */
.cover{position:relative;height:92vh;height:92svh;min-height:540px;overflow:hidden;background:#0d0b0a}
.cover .kb{position:absolute;inset:0;animation:kb 22s var(--ease) forwards}
.cover .ph{position:absolute;inset:0}
.cover::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(18,16,14,.5) 0%,rgba(18,16,14,0) 24%),linear-gradient(to top,rgba(18,16,14,.95) 0%,rgba(18,16,14,.45) 32%,rgba(18,16,14,0) 60%)}
.cover.nophoto{background:var(--bg2)}
.cover.nophoto::after{background:linear-gradient(to top,var(--bg) 0%,rgba(18,16,14,0) 45%)}
.cover .mapcover{position:absolute;inset:0}
.cover .mapcover svg{width:100%;height:100%}
.cover .c{position:absolute;z-index:2;left:var(--pad);right:var(--pad);bottom:clamp(50px,9vh,96px);display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.cover .k{font-family:var(--latin);font-style:italic;font-size:19px;letter-spacing:.06em;color:#E2C7A6;margin-bottom:18px}
.cover h1{text-wrap:balance;margin:0;font-family:var(--serif);font-weight:500;font-size:clamp(36px,5.4vw,76px);line-height:1.2;letter-spacing:.1em;color:#F3EDE3}
.cover .s{margin-top:22px;font-family:var(--serif);font-size:17px;line-height:1.9;letter-spacing:.1em;color:rgba(237,230,218,.86);max-width:36em}
.cover .whom{font-size:11px;letter-spacing:.28em;color:rgba(237,230,218,.7);display:flex;align-items:center;gap:10px;white-space:nowrap}
.cover .whom i{display:block;width:22px;border-top:1px solid var(--solo)}
.cover .whom.tg i{border-top:1.6px solid var(--acc)}
.sbar{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line);margin:0 var(--pad)}
.sbar>div{padding:30px 0 28px 24px;border-left:1px solid var(--line)}
.sbar>div:first-child{border-left:0;padding-left:0}
.sbar .n{font-family:var(--latin);font-weight:300;font-size:clamp(36px,3.6vw,52px);line-height:1;color:var(--ink);font-variant-numeric:lining-nums}
.sbar .n small{font-size:.42em;margin-left:4px;color:var(--muted);letter-spacing:.04em}
.sbar .l{margin-top:12px;font-size:11px;letter-spacing:.28em;color:var(--muted)}
.strip{margin:0 var(--pad);padding:44px 0 46px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.st-c{flex:0 0 auto;min-width:76px;cursor:pointer}
.st-c .nm{font-family:var(--serif);font-size:19px;letter-spacing:.1em;color:var(--ink);transition:color .3s;white-space:nowrap}
.st-c:hover .nm,.st-c.on .nm{color:var(--acc)}
.st-c .dd{margin-top:8px;font-size:11px;letter-spacing:.16em;color:var(--muted);white-space:nowrap}
.st-l{flex:1 1 60px;min-width:60px;max-width:200px;display:flex;flex-direction:column;align-items:center;padding:6px 14px 0}
.st-l svg{width:20px;height:20px;color:var(--ink2);margin-bottom:6px}
.st-l i{display:block;width:100%;border-top:1px dashed rgba(237,230,218,.22)}
.st-l span{margin-top:8px;font-size:10px;letter-spacing:.2em;color:var(--muted);white-space:nowrap}
.d-body{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:0 clamp(30px,4vw,72px);padding:0 var(--pad)}
.itin{padding:70px 0 40px}
.dmap{position:sticky;top:64px;height:calc(100vh - 64px);height:calc(100svh - 64px);padding:28px 0 28px}
.dmap .box{position:relative;width:100%;height:100%;background:#0E0C0B;border:1px solid var(--line);overflow:hidden}
.dmap svg{display:block;width:100%;height:100%}
.dmap .cap{position:absolute;left:18px;bottom:14px;right:18px;display:flex;justify-content:space-between;font-size:11px;letter-spacing:.22em;color:var(--muted);pointer-events:none}
.dmap .cap b{font-weight:400;font-family:var(--serif);font-size:14px;letter-spacing:.14em;color:var(--ink)}
.dmap .zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:1px}
.dmap .zoom button{width:30px;height:30px;background:rgba(18,16,14,.72);border:1px solid var(--line);color:var(--ink2);font-size:14px;line-height:1}
.dmap .zoom button:hover{color:var(--ink);border-color:var(--line2)}
.day{position:relative;padding:0 0 92px;scroll-margin-top:90px}
.day .dh{display:flex;align-items:baseline;gap:20px;margin-bottom:8px}
.day .dn{font-family:var(--latin);font-weight:300;font-size:64px;line-height:.9;color:rgba(237,230,218,.2);transition:color .6s;font-variant-numeric:lining-nums;min-width:1.3em}
.day.on .dn{color:var(--acc)}
.day .dd{font-size:11px;letter-spacing:.26em;color:var(--muted)}
.day .city{font-family:var(--serif);font-size:15px;letter-spacing:.2em;color:var(--acc);margin:22px 0 0;display:flex;align-items:center;gap:12px}
.day .city .via{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-size:11px;letter-spacing:.18em;color:var(--muted)}
.day .city .via svg{width:16px;height:16px;color:var(--ink2)}
.day h3{margin:14px 0 16px;font-family:var(--serif);font-weight:500;font-size:clamp(24px,2.2vw,31px);letter-spacing:.08em;line-height:1.4}
.day .tx{margin:0;font-family:var(--serif);font-size:16.5px;line-height:2.1;letter-spacing:.05em;color:var(--ink2);max-width:34em}
.facts{display:flex;flex-wrap:wrap;gap:0;margin-top:26px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts>div{flex:1 1 150px;padding:14px 18px 14px 0;display:flex;gap:12px;align-items:flex-start}
.facts>div+div{border-left:1px solid var(--line);padding-left:18px}
.facts svg{width:16px;height:16px;flex:0 0 auto;color:var(--muted);margin-top:2px}
.facts .fk{font-size:10px;letter-spacing:.3em;color:var(--muted)}
.facts .fv{margin-top:5px;font-size:13px;letter-spacing:.08em;color:var(--ink);line-height:1.6}
.pg{display:grid;gap:10px;margin-top:30px}
.pg.n1{grid-template-columns:1fr;max-width:78%}
.pg.n1 .ph{aspect-ratio:4/5}
.pg.n2{grid-template-columns:1fr 1fr}
.pg.n2 .ph{aspect-ratio:3/4}
.pg.n2 .ph:nth-child(2){margin-top:44px}
.pg.n3{grid-template-columns:1.35fr 1fr;grid-template-rows:1fr 1fr}
.pg.n3 .ph:first-child{grid-row:1/3;aspect-ratio:auto}
.pg.n3 .ph{aspect-ratio:3/4}
.pg.n4{grid-template-columns:1fr 1fr}
.pg.n4 .ph{aspect-ratio:3/4}
.moment-note{margin-top:22px;padding-left:18px;border-left:1px solid var(--acc2);font-size:13px;line-height:1.9;letter-spacing:.08em;color:var(--muted)}
.gallery{padding:30px var(--pad) 0}
.gallery .grid{columns:3;column-gap:12px;margin-top:40px}
.gallery .grid .ph{margin-bottom:12px;break-inside:avoid}
.dfoot{padding:clamp(100px,14vh,160px) var(--pad) 70px}
.dfoot .k{font-size:11px;letter-spacing:.34em;color:var(--muted);margin-bottom:30px}
.nx{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.nx a{position:relative;display:block;height:min(56vh,520px);overflow:hidden}
.nx a .ph{position:absolute;inset:0}
.nx a .ph img{transition:opacity .9s var(--ease),transform 2s var(--ease)}
.nx a:hover .ph img.ld{transform:scale(1.04)}
.nx a::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(18,16,14,.88),rgba(18,16,14,.1) 60%)}
.nx .t{position:absolute;z-index:2;left:30px;right:30px;bottom:28px}
.nx .t small{display:block;font-size:11px;letter-spacing:.3em;color:rgba(237,230,218,.7);margin-bottom:12px}
.nx .t b{font-family:var(--serif);font-weight:500;font-size:clamp(22px,2.2vw,30px);letter-spacing:.1em;color:#F3EDE3}
.nx .t em{display:block;font-style:normal;margin-top:10px;font-size:12px;letter-spacing:.18em;color:rgba(237,230,218,.66)}
.nx a.r .t{text-align:right}
.nx .maparts{opacity:.9}
.keys{margin-top:40px;text-align:center;font-size:11px;letter-spacing:.2em;color:var(--dim)}
.keys kbd{font-family:var(--latin);font-size:13px;border:1px solid var(--line2);border-radius:3px;padding:1px 7px;margin:0 4px;color:var(--ink2)}
.flash-day{animation:flashDay 2.4s var(--ease)}
@keyframes flashDay{0%{background:rgba(201,162,122,.0)}20%{background:rgba(201,162,122,.07)}100%{background:rgba(201,162,122,0)}}

/* visits (edinburgh) */
.visit .who2{display:inline-block;margin-top:16px;font-size:11px;letter-spacing:.26em;color:var(--ink2);padding:6px 12px;border:1px solid var(--line2);border-radius:999px}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:90;background:rgba(12,10,9,.97);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
.lb.open{opacity:1;pointer-events:auto}
.lb .stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:72px 90px 96px}
.lb img{max-width:100%;max-height:100%;object-fit:contain;opacity:0;transform:scale(.985);transition:opacity .5s var(--ease),transform .7s var(--ease);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.lb img.ld{opacity:1;transform:none}
.lb .cap{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:12px;letter-spacing:.24em;color:var(--ink2)}
.lb .cap b{font-family:var(--serif);font-weight:500;font-size:15px;letter-spacing:.14em;color:var(--ink);margin-right:14px}
.lb .cap span{font-family:var(--latin);font-size:14px;color:var(--muted);margin-left:14px;letter-spacing:.06em}
.lb .x{position:absolute;right:26px;top:20px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.lb .x:hover{color:var(--ink)}
.lb .pv,.lb .nv{position:absolute;top:50%;transform:translateY(-50%);width:56px;height:96px;display:flex;align-items:center;justify-content:center;color:var(--ink2);opacity:.6;transition:opacity .3s}
.lb .pv{left:14px}.lb .nv{right:14px}
.lb .pv:hover,.lb .nv:hover{opacity:1}
.lb svg{width:22px;height:22px}

/* china */
.cn-city{display:grid;grid-template-columns:repeat(12,1fr);gap:0 24px;margin-bottom:110px;align-items:end}

@media (max-width:1100px){
  .chap-h .yr{grid-column:1/13}
  .chap-h .txt{grid-column:1/10;margin-top:30px}
}

  .top{height:56px}
  .hero .meta{display:none}
  .hero .sub{font-size:15px}
  .nav{gap:18px}
  .nav a.opt{display:none}
  .top .mark i{display:none}
  .d-title{display:none}
  .d-nav{gap:16px}
  .d-nav a .lbl{display:none}
  .intro{grid-template-columns:1fr;padding-top:90px}
  .intro .k,.intro .lede{grid-column:1}
  .intro .k{margin-bottom:26px}
  .intro .lede{font-size:18px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat{padding:24px 0 22px 18px}
  .stat:nth-child(4){border-left:0;padding-left:0;border-top:1px solid var(--line)}
  .stat:nth-child(5){border-top:1px solid var(--line)}
  .stat .n{font-size:44px}
  .stat .l{font-size:11px;letter-spacing:.2em}
  .ov-head .wrap{flex-direction:column;align-items:flex-start}
  .legend{gap:18px;font-size:11px}
  .ov-sticky::after{background:linear-gradient(to top,rgba(18,16,14,.96) 0%,rgba(18,16,14,.75) 34%,rgba(18,16,14,0) 58%),linear-gradient(to bottom,var(--bg) 0%,rgba(18,16,14,0) 10%)}
  .ov-step{align-items:flex-end;padding-bottom:9vh}
  .ov-card{width:100%;padding:56px 0 6px;margin:0 calc(var(--pad)*-1);padding-left:var(--pad);padding-right:var(--pad);width:calc(100% + var(--pad)*2);background:linear-gradient(to bottom,rgba(18,16,14,0) 0,rgba(18,16,14,.9) 54px)}
  .ov-card .trips{display:none}
  .ov-card p{font-size:13px}
  .ov-card .trips a{padding:9px 0}
  .ov-year{top:80px;bottom:auto;right:var(--pad);font-size:84px}
  .chap{padding-top:110px}
  .chap-h .txt{grid-column:1/13}
  .chap-h .yr{font-size:30vw}
  .trip,.trip.l-a,.trip.l-b,.trip.l-c,.trip.l-d,.trip.l-map,.trip.l-map.flip{display:block;margin-bottom:96px}
  .trip .vis{margin:0 calc(var(--pad) * -1) 0}
  .trip.l-c .vis,.trip.l-d .vis{display:block;margin:0 16% 0 0}

  .trip .vis .second{display:none}
  .trip .vis .main,.trip.l-a .vis .main,.trip.l-b .vis .main{aspect-ratio:4/5}
  .trip.l-map .vis .main{aspect-ratio:1/1}

  .trip.l-d .info{padding-top:28px}
  .trip h3{font-size:28px;margin:12px 0 12px}
  .rmap{max-width:none;margin-top:26px}
  .turn{height:110vh}
  .turn .t{bottom:12vh;right:var(--pad)}
  .again-grid{display:block}
  .ag{margin:0 0 70px!important}
  .ag.g2,.ag.g3{width:78%}
  .ag.g3{margin-left:22%!important}
  .arow{grid-template-columns:1fr auto;gap:12px}
  .arow .th{grid-column:1/3;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
  .arow .th .ph{width:58px;height:76px}
  .foot{flex-direction:column;gap:10px}
