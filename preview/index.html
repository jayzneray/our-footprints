<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我们的足迹 · 改版效果稿 v6</title>
<style>
@font-face { font-family:'TravelSerif'; src:url('../public/fonts/noto-serif-sc-500-subset.woff') format('woff'); font-weight:500; font-display:swap; }
:root{
  --bg:#12100E; --ink:#EDE6DA; --muted:#8C8378; --faint:#2A2622; --line:rgba(237,230,218,.10); --accent:#C9A27A;
  --serif:'TravelSerif','Noto Serif SC','Noto Serif CJK SC','Source Han Serif SC','Songti SC',serif;
  --sans:-apple-system,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif;
  --pad:72px; --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.82) contrast(.93) brightness(.9) sepia(.1)}
/* film grain */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* top bar */
.top{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:30px var(--pad);font-size:12px;letter-spacing:.24em;color:rgba(237,230,218,.62);transition:background .4s var(--ease)}
.top .mark{font-family:var(--serif);font-weight:500;letter-spacing:.3em;opacity:0;transition:opacity .4s var(--ease)}
body.scrolled .top{background:rgba(18,16,14,.86);backdrop-filter:blur(10px);padding-top:22px;padding-bottom:22px}
body.scrolled .top .mark{opacity:1}
.switch{display:flex;gap:22px;font-family:var(--serif);font-weight:500}
.switch span{padding-bottom:5px;cursor:pointer}
.switch .on{color:var(--ink);border-bottom:1px solid var(--accent)}

/* hero */
.hero{position:relative;height:100vh;min-height:620px;overflow:hidden}
.hero img{object-position:50% 74%;transform:scale(1.02)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,16,14,.35) 0%,rgba(18,16,14,0) 22%,rgba(18,16,14,0) 52%,rgba(18,16,14,.78) 100%)}
.hero-text{position:absolute;left:var(--pad);bottom:84px;z-index:2}
.hero h1{margin:0;font-family:var(--serif);font-weight:500;font-size:62px;letter-spacing:.16em;line-height:1;color:#F1EBE0}
.hero p{margin:26px 0 0;font-size:14px;letter-spacing:.22em;color:rgba(237,230,218,.7)}
.hero .cap{position:absolute;right:var(--pad);bottom:88px;z-index:2;font-size:11px;letter-spacing:.24em;color:rgba(237,230,218,.5);text-align:right;line-height:2}
.hero .cue{position:absolute;left:50%;bottom:0;width:1px;height:56px;background:rgba(237,230,218,.32);z-index:2}

/* index intro */
.intro{display:grid;grid-template-columns:repeat(12,1fr);gap:0 24px;padding:150px var(--pad) 40px;align-items:end}
.intro .lab{grid-column:1/4;font-size:11px;letter-spacing:.3em;color:var(--muted)}
.intro .lede{grid-column:5/11;font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.9;letter-spacing:.08em;color:rgba(237,230,218,.86);margin:0}
.intro .lede em{font-style:normal;color:var(--accent)}

/* year */
.year{display:grid;grid-template-columns:repeat(12,1fr);gap:0 24px;padding:120px var(--pad) 56px;align-items:end;border-bottom:1px solid var(--line);margin:0 var(--pad);padding-left:0;padding-right:0}
.year .num{grid-column:1/8;font-family:var(--serif);font-weight:500;font-size:150px;line-height:.8;letter-spacing:.02em;color:var(--faint)}
.year .meta{grid-column:10/13;text-align:right;font-size:11px;letter-spacing:.28em;color:var(--muted);padding-bottom:6px}

/* trips */
.trip{display:grid;grid-template-columns:repeat(12,1fr);gap:0 24px;padding:96px var(--pad) 0;align-items:end}
.trip figure{margin:0;overflow:hidden;background:#1A1714}
.t-no{font-size:11px;letter-spacing:.3em;color:var(--muted);margin-bottom:22px}
.t-title{margin:0;font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.35;letter-spacing:.06em}
.t-meta{margin-top:18px;font-size:12px;letter-spacing:.18em;color:var(--muted);line-height:2}
.t-meta b{font-weight:400;color:rgba(237,230,218,.78)}
.t-more{display:inline-block;margin-top:30px;font-size:11px;letter-spacing:.3em;color:rgba(237,230,218,.62);border-bottom:1px solid rgba(201,162,122,.6);padding-bottom:6px}

.L figure{grid-column:1/8;aspect-ratio:4/5}
.L .txt{grid-column:9/13;padding-bottom:12px}
.Lr figure{grid-column:6/13;aspect-ratio:4/5;grid-row:1}
.Lr .txt{grid-column:1/5;grid-row:1;padding-bottom:12px}
.M figure{grid-column:7/12;aspect-ratio:3/4;grid-row:1}
.M .txt{grid-column:2/6;grid-row:1;align-self:start;padding-top:120px}
.Ml figure{grid-column:2/7;aspect-ratio:3/4}
.Ml .txt{grid-column:8/12;align-self:start;padding-top:120px}
.S figure{grid-column:8/11;aspect-ratio:3/4;grid-row:1}
.S .txt{grid-column:3/7;grid-row:1;padding-bottom:12px}
.T{padding-top:72px}
.T .txt{grid-column:5/12;display:grid;grid-template-columns:90px 1fr auto;align-items:baseline;border-top:1px solid var(--line);padding-top:26px}
.T .t-no{margin:0}
.T .t-title{font-size:24px}
.T .t-meta{margin:0;text-align:right}

/* divider */
.turn{padding:150px var(--pad) 130px;text-align:center}
.turn .rule{width:1px;height:56px;background:rgba(201,162,122,.55);margin:0 auto 48px}
.turn h2{margin:0;font-family:var(--serif);font-weight:500;font-size:34px;letter-spacing:.42em;padding-left:.42em;color:var(--ink)}
.turn p{margin:30px 0 0;font-size:11px;letter-spacing:.34em;color:var(--muted)}

/* full-bleed */
.bleed{position:relative;margin-top:0;height:84vh;min-height:560px;overflow:hidden}
.bleed img{object-position:50% 56%}
.bleed::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,16,14,0) 55%,rgba(18,16,14,.72) 100%)}
.bleed .txt{position:absolute;left:var(--pad);bottom:64px;z-index:2}
.bleed .t-title{font-size:44px}

/* places archive */
.archive{padding:200px var(--pad) 120px}
.archive .lab{font-size:11px;letter-spacing:.3em;color:var(--muted);margin-bottom:40px}
.arch{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.arch figure{margin:0 0 22px;aspect-ratio:4/5;overflow:hidden}
.arch .t-title{font-size:24px}
.end{padding:120px var(--pad) 140px;text-align:center;font-family:var(--serif);font-weight:500;font-size:16px;letter-spacing:.4em;color:var(--muted)}

/* mini globe */
.mini{position:fixed;right:40px;bottom:36px;z-index:30;display:flex;align-items:center;gap:20px;opacity:0;transform:translateY(8px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
body.scrolled .mini{opacity:1;transform:none}
.mini .lbl{text-align:right;text-shadow:0 0 12px rgba(18,16,14,.9)}
.mini .c{font-family:var(--serif);font-weight:500;font-size:15px;letter-spacing:.2em;color:var(--ink)}
.mini .n{margin-top:6px;font-size:10px;letter-spacing:.28em;color:var(--muted)}
.mini canvas{width:120px;height:120px}

@media (max-width:640px){
  :root{--pad:22px}
  .top{padding:22px var(--pad);font-size:11px}
  .switch{gap:16px}
  .hero{height:88vh;min-height:0}
  .hero img{object-position:50% 50%}
  .hero-text{bottom:58px}
  .hero h1{font-size:44px;letter-spacing:.12em}
  .hero p{font-size:12px;letter-spacing:.14em;margin-top:18px}
  .hero .cap{display:none}
  .hero .cue{height:36px}
  .intro{display:block;padding:72px var(--pad) 10px}
  .intro .lab{margin-bottom:18px}
  .intro .lede{font-size:17px}
  .year{display:flex;justify-content:space-between;padding:70px 0 26px}
  .year .num{font-size:84px}
  .trip{display:block;padding-top:56px}
  .trip figure{margin-bottom:22px}
  .M .txt,.Ml .txt{padding-top:0}
  .S figure{width:62%}
  .T .txt{display:block}
  .T .t-meta{text-align:left;margin-top:10px}
  .t-title{font-size:26px}
  .bleed{height:70vh}
  .turn{padding:130px var(--pad) 110px}
  .turn h2{font-size:22px;letter-spacing:.3em}
  .arch{grid-template-columns:1fr}
  .mini{right:16px;bottom:16px;gap:12px}
  .mini canvas{width:72px;height:72px}
}
</style>
</head>
<body>
<header class="top">
  <div class="mark">我们的足迹</div>
  <nav class="switch"><span class="on">世界</span><span>中国</span></nav>
</header>

<section class="hero">
  <img src="../public/photos/morocco/03.webp" alt="">
  <div class="hero-text">
    <h1>我们的足迹</h1>
    <p>去过 13 个国家和地区 · 22 个地方</p>
  </div>
  <div class="cap">摩洛哥<br>2024 年 12 月</div>
  <div class="cue"></div>
</section>

<main id="seq"></main>

<div class="mini" id="mini"><div class="lbl"><div class="c" id="miniC">摩洛哥</div><div class="n" id="miniN">07 / 14</div></div><canvas id="globe" width="224" height="224"></canvas></div>

<script src="../public/lib/d3.min.js"></script>
<script>
// Only real data: trips.json + chosen lead photos from public/photos
const LEAD = {
  '2019-korea':['korea/03','M'], '2024-iceland':['iceland/04','L'], '2024-switzerland':['switzerland/05','M'],
  '2024-thailand':['thailand/05','S'], '2024-morocco':['morocco/07','B'], '2025-wales':['wales/06','L'],
  '2025-france':['france/06','M'], '2025-italy-spring':['vatican/01','Lr'], '2025-greece':['greece/04','Ml'],
  '2025-spain-summer':['spain/04','L'], '2025-car-day':['birmingham/02','Ml'], '2026-sea-honeymoon':['malaysia/03','M']
};
const ARCH = {'uk-years':'london/06','edinburgh-again':'edinburgh/01','china':'qinhuangdao/04'};
const pad = n => String(n).padStart(2,'0');
const d = s => s.split('-'); 
function dateLine(t){
  if(!t.start) return '';
  const [y1,m1,d1]=d(t.start), e=t.end?d(t.end):null;
  if(!e) return `${y1}.${m1}.${d1}`;
  return `${y1}.${m1}.${d1} — ${e[0]!==y1?e[0]+'.':''}${e[1]}.${e[2]}`;
}
fetch('../public/data/trips.json').then(r=>r.json()).then(({trips})=>{
  const seq = trips.filter(t=>t.kind==='trip').sort((a,b)=>a.start.localeCompare(b.start));
  const longs = trips.filter(t=>t.kind!=='trip');
  const N = seq.length; let html = `<section class="intro"><div class="lab">旅程 · 按时间</div><p class="lede">2019 — 2026<br>${N} 段旅程</p></section>`;
  let year=null;
  seq.forEach((t,i)=>{
    const y = t.start.slice(0,4);
    if(y!==year){ year=y; const c=seq.filter(x=>x.start.startsWith(y)).length;
      html += `<div class="year"><div class="num">${y}</div><div class="meta">${c} 段旅程</div></div>`; }
    if(t.id==='2024-morocco') html += `<section class="turn" id="turn"><div class="rule"></div><h2>从这里开始，是我们</h2><p>2024 年 12 月 · 摩洛哥</p></section>`;
    const lead = LEAD[t.id];
    const meta = [dateLine(t), t.nights?`${t.nights} 晚`:''].filter(Boolean).join(' · ');
    const txt = `<div class="txt"><div class="t-no">${pad(i+1)}</div><h3 class="t-title">${t.title}</h3><div class="t-meta"><b>${t.countries.join(' · ')}</b><br>${meta}</div>${lead?'<span class="t-more">看照片</span>':''}</div>`;
    if(!lead){ html += `<article class="trip T" data-c="${t.countries[0]}" data-i="${i+1}"><div class="txt"><div class="t-no">${pad(i+1)}</div><h3 class="t-title">${t.title}</h3><div class="t-meta"><b>${t.countries.join(' · ')}</b>　${meta}</div></div></article>`; return; }
    const img = `<figure><img src="../public/photos/${lead[0]}.webp" alt="" loading="eager"></figure>`;
    if(lead[1]==='B') html += `<article class="bleed" id="morocco" data-c="${t.countries[0]}" data-i="${i+1}">${img.replace('<figure>','').replace('</figure>','')}${txt}</article>`;
    else html += `<article class="trip ${lead[1]}" data-c="${t.countries[0]}" data-i="${i+1}">${img}${txt}</article>`;
  });
  html += `<section class="archive"><div class="lab">常去的地方</div><div class="arch">` + longs.map(t=>{
    const sub = t.subtitle || (t.places.length>1&&t.id==='china'?`${t.places.length} 座城市`: (t.start&&t.end?`${t.start} — ${t.end}`:''));
    return `<div data-c="${t.countries[0]}"><figure><img src="../public/photos/${ARCH[t.id]}.webp" alt=""></figure><h3 class="t-title">${t.title}</h3>${sub?`<div class="t-meta">${sub}</div>`:''}</div>`;}).join('') + `</div></section><div class="end">下一站，还没决定</div>`;
  document.getElementById('seq').innerHTML = html;
  setupGlobe(N);
});
addEventListener('scroll',()=>document.body.classList.toggle('scrolled', scrollY>innerHeight*0.6),{passive:true});

function setupGlobe(N){
  fetch('../public/data/world-countries.json').then(r=>r.json()).then(geo=>{
    const visited = new Set(['韩国','法国','冰岛','葡萄牙','西班牙','瑞士','泰国','摩洛哥','英国','意大利','希腊','马来西亚','中国']);
    const cv=document.getElementById('globe'), ctx=cv.getContext('2d'), S=224, R=104;
    const proj=d3.geoOrthographic().scale(R).translate([S/2,S/2]).clipAngle(90);
    // land dots
    const feats=geo.features, dots=[];
    for(let lat=-80;lat<=84;lat+=3.2){ const step=3.2/Math.max(.25,Math.cos(lat*Math.PI/180));
      for(let lng=-180;lng<180;lng+=step){ const f=feats.find(f=>d3.geoContains(f,[lng,lat])); if(f) dots.push([lng,lat,f.properties.name]); } }
    let cur='摩洛哥';
    function draw(){
      const c=d3.geoCentroid(feats.find(f=>f.properties.name===cur)); proj.rotate([-c[0],-c[1]*0.6]);
      ctx.clearRect(0,0,S,S);
      ctx.beginPath(); ctx.arc(S/2,S/2,R,0,7); ctx.fillStyle='rgba(18,16,14,.78)'; ctx.fill(); ctx.strokeStyle='rgba(237,230,218,.10)'; ctx.lineWidth=1; ctx.stroke();
      const rot=proj.rotate();
      for(const [lng,lat,n] of dots){ if(d3.geoDistance([lng,lat],[-rot[0],-rot[1]])>Math.PI/2) continue;
        const [x,y]=proj([lng,lat]); const on=n===cur, v=visited.has(n);
        ctx.fillStyle= on?'#C9A27A': v?'rgba(237,230,218,.55)':'rgba(237,230,218,.2)';
        ctx.beginPath(); ctx.arc(x,y,on?2.4:1.6,0,7); ctx.fill(); }
    }
    draw();
    const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting&&e.target.dataset.c){ cur=e.target.dataset.c;
      document.getElementById('miniC').textContent=cur; document.getElementById('miniN').textContent=e.target.dataset.i?`${String(e.target.dataset.i).padStart(2,'0')} / ${N}`:'常去'; draw(); }}),{rootMargin:'-45% 0px -45% 0px'});
    document.querySelectorAll('[data-c]').forEach(el=>io.observe(el));
    window.__ready=true;
  });
}
</script>
</body>
</html>
