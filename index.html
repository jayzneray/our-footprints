      const memberIds = [];
      if (place.isCluster && place.childIds) {
        place.childIds.forEach(function (id) { memberIds.push(id); });
      } else {
        memberIds.push(place.id);
      }
      let chosen = null;
      // 优先 kind=trip
      const trips = tripsData.slice();
      for (let pass = 0; pass < 2 && !chosen; pass++) {
        for (let i = 0; i < trips.length; i++) {
          const t = trips[i];
          if (pass === 0 && t.kind !== 'trip') continue;
          const tIds = t.places || [];
          let hit = false;
          for (let j = 0; j < memberIds.length; j++) {
            if (tIds.indexOf(memberIds[j]) >= 0) { hit = true; break; }
          }
          if (hit) { chosen = t; break; }
        }
      }
      if (!chosen) return;

      // 若在详情页先回到列表
      const isInDetail = currentRoute.tripId != null;
      const proceed = function () {
        // 找到卡片并滚动高亮光晕
        requestAnimationFrame(function () {
          const card = tripsBody.querySelector('.trip-card[data-trip-id="' + cssEscape(chosen.id) + '"]');
          if (card) {
            if (card.scrollIntoView) {
              card.scrollIntoView({ behavior: prefersReducedMotion ? 'auto' : 'smooth', block: 'center' });
            }
            document.querySelectorAll('.trip-card.is-active').forEach(function (c) {
              if (c !== card) c.classList.remove('is-active', 'flash');
            });
            card.classList.add('is-active');
            card.classList.add('flash');
            setTimeout(function () { card.classList.remove('flash'); }, 1200);
          }
          // 地球飞至标记
          animateCamera({ lat: place.lat, lng: place.lng, altitude: 1.1 }, 1200, easeInOutCubic);
        });
      };

      if (isInDetail) {
        // 回到列表
        location.hash = '#/trips';
        setTimeout(proceed, 60);
      } else {
        proceed();
      }
    }

    function cssEscape(s) {
      if (window.CSS && CSS.escape) return CSS.escape(s);
      return String(s).replace(/["\\]/g, '\\$&');
    }

    /* ---------- 详情视图 ---------- */
    function fmtVisitsDate(v) {
      const s = v.start || '';
      const e = v.end || '';
      if (!s && !e) return '';
      if (isLongDateStr(s) || isLongDateStr(e)) {
        if (s && e && s !== e) return s + ' – ' + e;
        return s || e || '';
      }
      if (s && e) {
        if (s.slice(0, 4) === e.slice(0, 4)) return fmtYearMonthDay(s) + ' – ' + fmtMonthDay(e);
        return fmtYearMonthDay(s) + ' – ' + fmtYearMonthDay(e);
      }
      return fmtYearMonthDay(s || e);
    }

    function collectTripPhotos(trip) {
      const out = [];
      if (!trip.places) return out;
      trip.places.forEach(function (pid) {
        const raw = placesById[pid];
        if (raw && raw.photos) {
          raw.photos.forEach(function (ph) {
            out.push(ph);
          });
        }
      });
      return out;
    }

    function buildDetailHTML(trip) {
      tripsDetail.textContent = '';

      const back = document.createElement('button');
      back.className = 'detail-back';
      back.type = 'button';
      back.textContent = '← 全部旅行';
      back.addEventListener('click', function () { location.hash = '#/trips'; });
      tripsDetail.appendChild(back);

      const title = document.createElement('div');
      title.className = 'detail-title';
      title.textContent = trip.title || '';
      tripsDetail.appendChild(title);

      const metaStr = buildTripMeta(trip);
      if (metaStr) {
        const metaEl = document.createElement('div');
        metaEl.className = 'detail-meta';
        metaEl.textContent = metaStr;
        tripsDetail.appendChild(metaEl);
      }

      if (trip.countries && trip.countries.length) {
        const cEl = document.createElement('div');
        cEl.className = 'detail-countries';
        cEl.textContent = trip.countries.join('·');
        tripsDetail.appendChild(cEl);
      }

      // visits
      if (trip.visits && trip.visits.length) {
        const h = document.createElement('div');
        h.className = 'detail-section-title';
        h.textContent = '每一次';
        tripsDetail.appendChild(h);

        const wrap = document.createElement('div');
        trip.visits.forEach(function (v) {
          const row = document.createElement('div');
          row.className = 'visit-row';
          const d = document.createElement('div');
          d.className = 'visit-dates';
          d.textContent = fmtVisitsDate(v);
          const n = document.createElement('div');
          n.className = 'visit-note';
          n.textContent = v.note || '';
          row.appendChild(d);
          row.appendChild(n);
          wrap.appendChild(row);
        });
        tripsDetail.appendChild(wrap);
      }

      // stops
      if (trip.stops && trip.stops.length) {
        const h = document.createElement('div');
        h.className = 'detail-section-title';
        h.textContent = '几站';
        tripsDetail.appendChild(h);

        trip.stops.forEach(function (s) {
          const row = document.createElement('div');
          row.className = 'stop-row';
          row.textContent = s.name || '';
          row.addEventListener('click', function () {
            if (!globe) return;
            let lat, lng, alt = 1.1;
            if (s.place && placesById[s.place]) {
              lat = Number(placesById[s.place].lat);
              lng = Number(placesById[s.place].lng);
              if (isNaN(lat) || isNaN(lng)) return;
            } else if (s.name && COUNTRY_CENTERS[s.name]) {
              lat = COUNTRY_CENTERS[s.name][0];
              lng = COUNTRY_CENTERS[s.name][1];
              alt = 1.6;
            } else {
              return;
            }
            stopAutoRotate();
            animateCamera({ lat: lat, lng: lng, altitude: alt }, 1200, easeInOutCubic);
          });
          tripsDetail.appendChild(row);
        });
      }

      // photos
      const photos = collectTripPhotos(trip);
      if (photos.length) {
        const h = document.createElement('div');
        h.className = 'detail-section-title';
        h.textContent = '照片';
        tripsDetail.appendChild(h);

        const grid = document.createElement('div');
        grid.className = 'detail-photos';
        photos.forEach(function (ph, idx) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'detail-photo';
          const ar = (ph.w && ph.h) ? (ph.w / ph.h) : (4 / 5);
          btn.style.aspectRatio = String(ar);

          const img = document.createElement('img');
          img.src = fullPath(ph.thumb || ph.src);
          img.alt = ph.caption || '';
          img.loading = 'lazy';
          btn.appendChild(img);

          btn.addEventListener('click', function () {
            openLightbox(photos, idx, btn);
          });

          grid.appendChild(btn);
        });
        tripsDetail.appendChild(grid);
      }
    }

    function enterTripDetail(tripId) {
      if (!tripsData) {
        // 未加载完成时先登记路由，加载完再处理
        currentRoute = { page: 'trips', tripId: tripId };
        return;
      }
      const trip = findTripById(tripId);
      if (!trip) {
        location.hash = '#/trips';
        return;
      }

      // 记录列表滚动位置（仅第一次进入）
      if (!tripInDetail) {
        listScrollPos = tripsPane.scrollTop;
      }

      currentRoute = { page: 'trips', tripId: tripId };
      tripInDetail = trip;
      applyTripMarkerHighlight();

      buildDetailHTML(trip);

      // 切换视图
      tripsDetail.setAttribute('aria-hidden', 'false');
      tripsList.classList.add('hide');
      tripsDetail.classList.add('show');
      tripsPane.scrollTop = 0;
      tripsDetail.scrollTop = 0;

      focusTripOnGlobe(trip);
    }

    function leaveTripDetail() {
      if (!tripInDetail) return;
      tripInDetail = null;
      currentRoute = { page: 'trips', tripId: null };
      applyTripMarkerHighlight();

      tripsDetail.classList.remove('show');
      tripsDetail.setAttribute('aria-hidden', 'true');
      tripsList.classList.remove('hide');

      // 恢复列表滚动位置
      requestAnimationFrame(function () {
        tripsPane.scrollTop = listScrollPos;
      });
    }

    /* ---------- 灯箱 ---------- */
    function openLightbox(photos, idx, triggerEl) {
      lbPhotos = photos;
      lbIndex = idx;
      lbReturnFocus = triggerEl || null;
      updateLightbox();
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
      try { lbClose.focus({ preventScroll: true }); } catch (e) { lbClose.focus(); }
    }

    function updateLightbox() {
      if (!lbPhotos.length) return;
      const ph = lbPhotos[lbIndex];
      lbImg.src = fullPath(ph.src);
      lbImg.alt = ph.caption || '';
      const showNav = lbPhotos.length > 1;
      lbPrev.style.display = showNav ? '' : 'none';
      lbNext.style.display = showNav ? '' : 'none';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
      if (lbReturnFocus && document.body.contains(lbReturnFocus)) {
        try { lbReturnFocus.focus({ preventScroll: true }); } catch (e) { lbReturnFocus.focus(); }
      }
      lbReturnFocus = null;
      lbPhotos = [];
    }

    function lbStep(dir) {
      if (lbPhotos.length <= 1) return;
      lbIndex = (lbIndex + dir + lbPhotos.length) % lbPhotos.length;
      updateLightbox();
    }

    /* ---------- 路由 ---------- */
    function applyRoute() {
      const r = parseHash();

      if (r.page === 'map') {
        // 离开旅行页
        if (wasOnTrips) {
          wasOnTrips = false;
          document.body.classList.remove('is-trips');
          tripsPane.classList.remove('open');
          tripsPane.setAttribute('aria-hidden', 'true');
          tripInDetail = null;
          currentRoute = { page: 'map', tripId: null };
          applyTripMarkerHighlight();
          // 恢复地球尺寸并恢复自转
          resizeGlobe();
          scheduleAutoRotate(1200);
          navMapBtn.classList.add('active');
          navTripsBtn.classList.remove('active');
        }
        // 返回地图页：重新处理 ?place= （如果 hash 变回地图），无 hash 时不额外处理
        return;
      }

      // 旅行页路由
      currentRoute = r;

      if (panelOpen) {
        // 进入旅行页先关闭照片面板（不回写历史）
        panelOpen = false;
        selectedPlaceId = null;
        currentPlace = null;
        cancelFlyOverlay();
        panelMainPhoto.style.visibility = '';
        panel.classList.remove('open', 'closing');
        panel.style.opacity = '';
        panel.style.transform = '';
        panel.style.transition = '';
        panel.setAttribute('aria-hidden', 'true');
        setFocusVisualState(false);
        focusSequenceToken++;
        cancelCameraAnimation();
        replaceWithoutPlace();
      }

      const enteringTrips = !wasOnTrips;
      if (!wasOnTrips) {
        wasOnTrips = true;
        document.body.classList.add('is-trips');
        tripsPane.classList.add('open');
        tripsPane.setAttribute('aria-hidden', 'false');
        navMapBtn.classList.remove('active');
        navTripsBtn.classList.add('active');

        // 若当前中国视角，切回世界
        if (view === 'china') {
          setView('world');
        }
        stopAutoRotate();
        // 更新地球尺寸
        requestAnimationFrame(function () { resizeGlobe(); });
      }

      ensureTripsLoaded().then(function () {
        if (!tripsLoadFailed) {
          if (r.tripId) {
            enterTripDetail(r.tripId);
          } else {
            if (tripInDetail) leaveTripDetail();
            // 刚从地图页进入旅行列表：拉远，让整颗地球完整出现在右侧
            if (enteringTrips && globe) {
              const pov = globe.pointOfView();
              if (pov.altitude < 1.8) {
                animateCamera({ lat: pov.lat, lng: pov.lng, altitude: 1.9 }, prefersReducedMotion ? 0 : 1000, easeInOutCubic);
              }
            }
          }
        }
        applyTripMarkerHighlight();
      }).catch(function () {
        if (r.tripId) location.hash = '#/trips';
      });
    }

    function onHashChange() {
      applyRoute();
    }

    /* ---------- 事件 ---------- */
    function bindEvents() {
      panelCloseBtn.addEventListener('click', function () { closePanel(); });

      viewWorldBtn.addEventListener('click', function () { setView('world'); });
      viewChinaBtn.addEventListener('click', function () { setView('china'); });

      navMapBtn.addEventListener('click', function () {
        location.hash = '';
      });
      navTripsBtn.addEventListener('click', function () {
        if (parseHash().page === 'trips') return;
        location.hash = '#/trips';
      });

      window.addEventListener('hashchange', onHashChange);

      lbClose.addEventListener('click', closeLightbox);
      lbPrev.addEventListener('click', function () { lbStep(-1); });
      lbNext.addEventListener('click', function () { lbStep(1); });
      lightbox.addEventListener('click', function (e) {
        if (e.target === lightbox) closeLightbox();
      });

      document.addEventListener('keydown', function (e) {
        // 灯箱优先
        if (lightbox.classList.contains('open')) {
          if (e.key === 'Escape') { e.preventDefault(); closeLightbox(); return; }
          if (e.key === 'ArrowLeft') { e.preventDefault(); lbStep(-1); return; }
          if (e.key === 'ArrowRight') { e.preventDefault(); lbStep(1); return; }
          return;
        }

        if (e.key === 'Escape') {
          if (currentRoute.page === 'trips' && currentRoute.tripId) {
            e.preventDefault();
            location.hash = '#/trips';
            return;
          }
          if (panelOpen) {
            e.preventDefault();
            closePanel();
          }
          return;
        }

        if (!panelOpen) return;

        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
          if (currentPhotos.length <= 1) return;
          e.preventDefault();
          if (e.key === 'ArrowLeft') {
            currentPhotoIndex = (currentPhotoIndex - 1 + currentPhotos.length) % currentPhotos.length;
          } else {
            currentPhotoIndex = (currentPhotoIndex + 1) % currentPhotos.length;
          }
          updateMainPhoto();
        }
      });
    }

    /* ---------- 错误提示 ---------- */
    function showError() {
      const div = document.createElement('div');
      div.className = 'error-msg';
      div.textContent = '数据加载失败，请刷新重试';
      document.body.appendChild(div);
    }

    /* ---------- 启动 ---------- */
    function fetchJson(path) {
      return fetch(PREFIX + path).then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      });
    }

    function start() {
      const initialRoute = parseHash();
      // 首次加载为旅行路由：忽略 ?place=
      if (initialRoute.page === 'trips') {
        try {
          const url = new URL(window.location.href);
          if (url.searchParams.has('place')) {
            url.searchParams.delete('place');
            history.replaceState({ placeId: null }, '', url.pathname + url.search + url.hash);
          }
        } catch (e) { /* ignore */ }
      }

      Promise.all([
        fetchJson('data/places.json'),
        // 国家数据：public/data/world-countries.json，来自 Natural Earth 1:110m Admin 0 Countries（公有领域，https://www.naturalearthdata.com/）；其中中国轮廓替换为上面 ECharts 省份数据的合并，相邻国家已扣除重叠部分。本地加载。
        fetchJson('data/world-countries.json').catch(function (err) {
          console.error('世界国家数据加载失败，陆地光点为空:', err);
          return null;
        })
      ]).then(function (results) {
        const data = results[0];
        worldCountries = results[1];

        allPlaces = data.places || [];
        placesById = {};
        allPlaces.forEach(function (p) { placesById[p.id] = p; });
        updateHeader(data);

        view = 'world';
        places = (function () {
          const worldMarkers = [];
          allPlaces.forEach(function (p) {
            if (p.scope !== 'china') worldMarkers.push(toMarker(p));
          });
          const chinaAgg = buildChinaAggregateMarker();
          if (chinaAgg) worldMarkers.push(chinaAgg);
          return clusterByCountry(worldMarkers, UK_COUNTRIES, 1.15);
        })();

        initGlobe(places);
        bindEvents();
        bindVisibility();
        bindHistory();

        const r = parseHash();
        if (r.page === 'trips') {
          applyRoute();
        } else {
          handleDeepLink();
          applyRoute(); // 保证初始导航状态一致
        }
      }).catch(function (err) {
        console.error('加载数据失败:', err);
        showError();
        // 尽量仍能进旅行页
        try {
          bindEvents();
          applyRoute();
        } catch (e) { /* ignore */ }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else {
      start();
    }
  })();
  </script>
</body>
</html>
